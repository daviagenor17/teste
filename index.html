<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>3D Synthwave Runner</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #00ffff;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 0 0 10px #00ffff;
      pointer-events: none;
    }
    #game-over {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      text-align: center;
      display: none;
    }
    #game-over h1 {
      font-size: 52px;
      color: #ff0055;
      margin: 0;
      text-shadow: 0 0 20px #ff0055;
    }
    #game-over p {
      font-size: 20px;
      margin-top: 10px;
      color: #ccc;
    }
  </style>
</head>
<body>

  <div id="ui">PONTOS: <span id="score">0</span></div>

  <div id="game-over">
    <h1>GAME OVER</h1>
    <p>Pressione <b>ESPAÇO</b> para Reiniciar</p>
  </div>

  <!-- Biblioteca Three.js para renderização 3D -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // --- 1. CONFIGURAÇÃO DA CENA 3D ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0a1a, 0.025);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // --- 2. ILUMINAÇÃO ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0x00ffff, 0.8);
    dirLight.position.set(0, 10, 10);
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0xff0055, 2, 30);
    scene.add(pointLight);

    // --- 3. CENÁRIO 3D (PISTA NEON) ---
    const trackGeo = new THREE.PlaneGeometry(12, 300);
    const trackMat = new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.1, metalness: 0.8 });
    const track = new THREE.Mesh(trackGeo, trackMat);
    track.rotation.x = -Math.PI / 2;
    track.position.z = -100;
    scene.add(track);

    // Linhas Laterais
    const lineGeo = new THREE.BoxGeometry(0.2, 0.2, 300);
    const lineMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
    
    const lineL = new THREE.Mesh(lineGeo, lineMat);
    lineL.position.set(-6, 0.1, -100);
    scene.add(lineL);

    const lineR = new THREE.Mesh(lineGeo, lineMat);
    lineR.position.set(6, 0.1, -100);
    scene.add(lineR);

    // --- 4. JOGADOR (CUBO 3D) ---
    const playerGeo = new THREE.BoxGeometry(1, 1, 1);
    const playerMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x004444, roughness: 0.2 });
    const player = new THREE.Mesh(playerGeo, playerMat);
    player.position.set(0, 0.5, 0);
    scene.add(player);

    // Posicionamento da Câmera
    camera.position.set(0, 3.5, 6);
    camera.rotation.x = -0.3;

    // --- 5. LÓGICA DO JOGO ---
    let obstacles = [];
    let speed = 0.6;
    let score = 0;
    let isGameOver = false;
    let spawnTimer = 0;
    const keys = {};

    // Gerar Obstáculos em 3D
    function spawnObstacle() {
      const size = Math.random() * 0.8 + 0.8;
      const geo = new THREE.BoxGeometry(size, size, size);
      const mat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0x660022 });
      const obs = new THREE.Mesh(geo, mat);
      
      const posX = (Math.random() - 0.5) * 10;
      obs.position.set(posX, size / 2, -120);
      scene.add(obs);
      obstacles.push(obs);
    }

    // Controles
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (isGameOver && e.code === 'Space') restartGame();
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function restartGame() {
      obstacles.forEach(obs => scene.remove(obs));
      obstacles = [];
      score = 0;
      speed = 0.6;
      player.position.x = 0;
      isGameOver = false;
      document.getElementById('game-over').style.display = 'none';
      document.getElementById('score').innerText = '0';
    }

    // --- 6. LOOP DE ANIMAÇÃO ---
    function animate() {
      requestAnimationFrame(animate);

      if (isGameOver) return;

      // Movimento do Jogador (A/D ou Setas)
      if ((keys['ArrowLeft'] || keys['KeyA']) && player.position.x > -5) {
        player.position.x -= 0.18;
      }
      if ((keys['ArrowRight'] || keys['KeyD']) && player.position.x < 5) {
        player.position.x += 0.18;
      }

      // Animação de rotação do jogador
      player.rotation.z = -player.position.x * 0.08;
      player.rotation.x += 0.05;

      // Atualiza luz neon acompanhando o jogador
      pointLight.position.set(player.position.x, 2, player.position.z);

      // Gerar novos obstáculos
      spawnTimer++;
      if (spawnTimer > 12) {
        spawnObstacle();
        spawnTimer = 0;
      }

      // Atualizar Obstáculos
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.position.z += speed;
        obs.rotation.x += 0.02;
        obs.rotation.y += 0.02;

        // Detecção de Colisão 3D
        const playerBox = new THREE.Box3().setFromObject(player);
        const obsBox = new THREE.Box3().setFromObject(obs);

        if (playerBox.intersectsBox(obsBox)) {
          isGameOver = true;
          document.getElementById('game-over').style.display = 'block';
        }

        // Remover obstáculos que passaram
        if (obs.position.z > 10) {
          scene.remove(obs);
          obstacles.splice(i, 1);
          score += 10;
          speed += 0.003; // Aumenta a velocidade progressivamente
          document.getElementById('score').innerText = score;
        }
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
