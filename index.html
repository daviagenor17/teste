<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blox Fruits 3D - Rework Completo & Fênix Mythical</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; background: #000; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
    #ui {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
    }
    .status-bar {
      background: rgba(15, 15, 25, 0.85); backdrop-filter: blur(8px);
      border: 2px solid #00f3ff; border-radius: 12px; padding: 15px 25px;
      width: 360px; color: #fff;
    }
    .status-title { font-size: 16px; font-weight: 900; color: #00f3ff; margin-bottom: 8px; text-transform: uppercase; }
    .bar-container { background: #222; height: 14px; border-radius: 8px; overflow: hidden; margin-bottom: 6px; border: 1px solid #444; }
    .hp-bar { background: linear-gradient(90deg, #ff0055, #ff5500); width: 100%; height: 100%; transition: width 0.2s; }
    .xp-bar { background: linear-gradient(90deg, #00f3ff, #0055ff); width: 0%; height: 100%; transition: width 0.2s; }
    .info-text { font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; color: #ccc; }
    .quest-panel {
      position: absolute; top: 20px; right: 20px;
      background: rgba(15, 15, 25, 0.85); border: 2px solid #ffaa00;
      border-radius: 12px; padding: 15px; width: 260px; color: #fff;
    }
    .quest-title { color: #ffaa00; font-weight: 900; font-size: 16px; margin-bottom: 5px; }
    .hotbar-container {
      align-self: center; display: flex; gap: 10px; margin-bottom: 15px;
      background: rgba(10, 10, 20, 0.85); padding: 10px 18px; border-radius: 15px;
      border: 2px solid rgba(0, 243, 255, 0.3);
    }
    .hotbar-slot {
      background: rgba(20, 20, 35, 0.9); border: 2px solid #00f3ff;
      border-radius: 10px; padding: 8px; width: 105px; text-align: center; color: #fff;
    }
    .hotbar-slot.transform { border-color: #ff00ea; }
    .skill-key { font-size: 16px; font-weight: 900; color: #00f3ff; }
    .hotbar-slot.transform .skill-key { color: #ff00ea; }
    .skill-name { font-size: 10px; font-weight: bold; margin-top: 3px; text-transform: uppercase; color: #fff; }
    .controls-guide {
      position: absolute; bottom: 20px; left: 20px;
      background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px;
      color: #aaa; font-size: 12px; border: 1px solid #333;
    }
    #center-msg {
      position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%);
      font-size: 26px; font-weight: 900; color: #ffd700; text-shadow: 0 0 20px #ff0055;
      opacity: 0; transition: opacity 0.3s; text-transform: uppercase; text-align: center; pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="ui">
    <div class="status-bar">
      <div class="status-title">Nível <span id="lbl-level">1</span> | Fruta: <span id="lbl-fruit" style="color:#00f3ff">Fênix</span></div>
      <div class="bar-container"><div id="hp-bar" class="hp-bar"></div></div>
      <div class="bar-container"><div id="xp-bar" class="xp-bar"></div></div>
      <div class="info-text">
        <span>HP: <span id="lbl-hp">100/100</span></span>
        <span>Beli: $<span id="lbl-beli">1000</span></span>
      </div>
    </div>

    <div class="quest-panel">
      <div class="quest-title">📜 Missão Atual</div>
      <div id="quest-desc" style="font-size: 13px; color: #ddd;">Fale com o NPC Azul.</div>
      <div style="font-size: 12px; color: #ffaa00; margin-top: 8px;" id="quest-prog">Progresso: 0/3 Bandidos</div>
    </div>

    <div id="center-msg">MENSAGEM</div>

    <div class="hotbar-container">
      <div class="hotbar-slot"><div class="skill-key">Z</div><div class="skill-name" id="slot-z">Skill Z</div></div>
      <div class="hotbar-slot"><div class="skill-key">X</div><div class="skill-name" id="slot-x">Skill X</div></div>
      <div class="hotbar-slot"><div class="skill-key">C</div><div class="skill-name" id="slot-c">Skill C</div></div>
      <div class="hotbar-slot transform"><div class="skill-key">V</div><div class="skill-name" id="slot-v">Transformar</div></div>
    </div>

    <div class="controls-guide">
      <b>Movimento:</b> WASD | <b>Pulo:</b> Espaço | <b>Skills:</b> Z, X, C | <b>Transformar:</b> V<br>
      <span style="color:#ff00ea">NPC Roxo: Giro ($500)</span> | <span style="color:#0055ff">NPC Azul: Missão</span>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // --- ÁUDIO SINTETIZADO ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    function playSound(type) {
      if(!audioCtx) audioCtx = new AudioCtx();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if(type==='phoenix') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now+0.4);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now+0.4);
        osc.start(now); osc.stop(now+0.4);
      } else if(type==='distortion') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(50, now+0.5);
        gain.gain.setValueAtTime(0.35, now); gain.gain.linearRampToValueAtTime(0.01, now+0.5);
        osc.start(now); osc.stop(now+0.5);
      } else if(type==='sound') {
        osc.type = 'square'; osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(880, now+0.1);
        gain.gain.setValueAtTime(0.25, now); gain.gain.linearRampToValueAtTime(0.01, now+0.3);
        osc.start(now); osc.stop(now+0.3);
      } else if(type==='shadow') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(100, now);
        osc.frequency.linearRampToValueAtTime(30, now+0.5);
        gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0.01, now+0.5);
        osc.start(now); osc.stop(now+0.5);
      } else if(type==='hit') {
        osc.type = 'square'; osc.frequency.setValueAtTime(120, now);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now+0.1);
        osc.start(now); osc.stop(now+0.1);
      }
    }

    // --- REWORK DAS FRUTAS ---
    const FRUITS = {
      phoenix: {
        name: "Fênix (Mythical)", color: 0x00f3ff,
        hasTransformation: true,
        skills: { z: "Garras Azuis", x: "Erupção Curativa", c: "Asas do Firmamento", v: "Transformar" }
      },
      distortion: {
        name: "Distorção (Paramecia)", color: 0x9900ff,
        hasTransformation: false,
        skills: { z: "Fenda Repentina", x: "Colapso de Vácuo", c: "Troca de Matéria", v: "Singularidade" }
      },
      sound: {
        name: "Som Sônico (Paramecia)", color: 0xffff00,
        hasTransformation: false,
        skills: { z: "Grito de Impacto", x: "Batida Sísmica", c: "Disparo Frequencial", v: "Sobrecarga Auditiva" }
      },
      shadow: {
        name: "Sombra (Logia)", color: 0x330066,
        hasTransformation: false,
        skills: { z: "Estocada Penumbra", x: "Tentáculos Vorazes", c: "Dublê Obscuro", v: "Eclipse Profundo" }
      },
      dragon: {
        name: "Dragão (Zoan)", color: 0xaa00ff,
        hasTransformation: true,
        skills: { z: "Garra Suprema", x: "Sopro da Besta", c: "Rugido Divino", v: "Transformar" }
      }
    };

    const GROUND_Y = 5.2;

    // --- CENA THREE.JS ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111827);
    scene.fog = new THREE.FogExp2(0x111827, 0.007);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(50, 100, 50);
    scene.add(dirLight);

    // MUNDO
    const ocean = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshStandardMaterial({ color: 0x0f2042 }));
    ocean.rotation.x = -Math.PI / 2;
    scene.add(ocean);

    const island = new THREE.Mesh(new THREE.CylinderGeometry(45, 50, 4, 32), new THREE.MeshStandardMaterial({ color: 0x1f2937 }));
    island.position.y = 2;
    scene.add(island);

    // --- MODELADOR ROBLOX (CORREÇÃO PERNAS) ---
    function createRobloxCharacter(colorSkin, colorShirt) {
      const group = new THREE.Group();
      const humanMesh = new THREE.Group();

      const matSkin = new THREE.MeshStandardMaterial({ color: colorSkin, roughness: 0.5 });
      const matShirt = new THREE.MeshStandardMaterial({ color: colorShirt, roughness: 0.5 });

      const torso = new THREE.Mesh(new THREE.BoxGeometry(1, 1.2, 0.5), matShirt);
      torso.position.y = 0.6;
      humanMesh.add(torso);

      const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), matSkin);
      head.position.y = 1.6;
      humanMesh.add(head);

      const armLGroup = new THREE.Group();
      armLGroup.position.set(-0.7, 1.1, 0);
      const armL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), matShirt);
      armL.position.y = -0.5;
      armLGroup.add(armL);
      humanMesh.add(armLGroup);

      const armRGroup = new THREE.Group();
      armRGroup.position.set(0.7, 1.1, 0);
      const armR = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), matShirt);
      armR.position.y = -0.5;
      armRGroup.add(armR);
      humanMesh.add(armRGroup);

      const legLGroup = new THREE.Group();
      legLGroup.position.set(-0.25, 0, 0);
      const legL = new THREE.Mesh(new THREE.BoxGeometry(0.45, 1.2, 0.45), matSkin);
      legL.position.y = -0.6;
      legLGroup.add(legL);
      humanMesh.add(legLGroup);

      const legRGroup = new THREE.Group();
      legRGroup.position.set(0.25, 0, 0);
      const legR = new THREE.Mesh(new THREE.BoxGeometry(0.45, 1.2, 0.45), matSkin);
      legR.position.y = -0.6;
      legRGroup.add(legR);
      humanMesh.add(legRGroup);

      group.add(humanMesh);
      group.humanMesh = humanMesh;
      group.armL = armLGroup; group.armR = armRGroup;
      group.legL = legLGroup; group.legR = legRGroup;
      group.head = head;
      group.materials = [matSkin, matShirt];

      return group;
    }

    // --- MODELO DETALHADO DA FÊNIX ANCESTRAL (ZOAN REAL) ---
    function createPhoenixModel() {
      const phoenix = new THREE.Group();
      const matFeather = new THREE.MeshStandardMaterial({ color: 0x00f3ff, emissive: 0x0066aa, roughness: 0.2 });
      const matGold = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.3 });
      const matEye = new THREE.MeshBasicMaterial({ color: 0xffffff });

      // Corpo Espiritual
      const body = new THREE.Mesh(new THREE.ConeGeometry(0.9, 2.5, 8), matFeather);
      body.rotation.x = Math.PI / 3;
      phoenix.add(body);

      // Cabeça de Fênix com Crista
      const headGroup = new THREE.Group();
      headGroup.position.set(0, 1.2, 0.8);
      
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), matFeather);
      headGroup.add(head);

      const beak = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.8, 4), matGold);
      beak.rotation.x = Math.PI / 2;
      beak.position.set(0, -0.1, 0.5);
      headGroup.add(beak);

      const crest = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.8, 0.6), matGold);
      crest.position.set(0, 0.5, -0.2);
      headGroup.add(crest);

      phoenix.add(headGroup);

      // Asas Flamejantes Gigantes
      const wingL = new THREE.Group();
      wingL.position.set(-0.6, 0.5, 0);
      const featherL = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.1, 1.4), matFeather);
      featherL.position.x = -1.75;
      wingL.add(featherL);
      phoenix.add(wingL);

      const wingR = new THREE.Group();
      wingR.position.set(0.6, 0.5, 0);
      const featherR = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.1, 1.4), matFeather);
      featherR.position.x = 1.75;
      wingR.add(featherR);
      phoenix.add(wingR);

      // Cauda Espiritual
      const tail = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.05, 3.0), matGold);
      tail.position.set(0, -0.5, -1.8);
      tail.rotation.x = -0.2;
      phoenix.add(tail);

      phoenix.wingL = wingL; phoenix.wingR = wingR;
      phoenix.scale.set(1.4, 1.4, 1.4);
      phoenix.visible = false;
      return phoenix;
    }

    // PERSONAGEM & NPCS
    const player = createRobloxCharacter(0xffcc99, 0x00f3ff);
    player.position.set(0, GROUND_Y, 10);
    scene.add(player);

    const phoenixMesh = createPhoenixModel();
    player.add(phoenixMesh);
    player.phoenixMesh = phoenixMesh;

    const npcQuest = createRobloxCharacter(0xffcc99, 0x0055ff);
    npcQuest.position.set(-6, GROUND_Y, -8);
    scene.add(npcQuest);

    const npcGacha = createRobloxCharacter(0xffcc99, 0x9900ff);
    npcGacha.position.set(6, GROUND_Y, -8);
    scene.add(npcGacha);

    const playerData = {
      level: 1, xp: 0, maxXp: 100,
      hp: 120, maxHp: 120, beli: 1000,
      questActive: false, questKills: 0,
      currentFruit: 'phoenix',
      isTransformed: false,
      vy: 0, isGrounded: true, speed: 0.25, isAttacking: false
    };

    const enemies = [];
    function spawnEnemy(x, z) {
      const enemy = createRobloxCharacter(0xffcc99, 0x444444);
      enemy.position.set(x, GROUND_Y, z);
      enemy.hp = 90; enemy.maxHp = 90;
      enemy.spawnPos = { x, z };
      scene.add(enemy);
      enemies.push(enemy);
    }
    spawnEnemy(12, 5); spawnEnemy(-12, 0); spawnEnemy(15, -10);

    // CONTROLES
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if(e.code === 'KeyZ') castSkill('z');
      if(e.code === 'KeyX') castSkill('x');
      if(e.code === 'KeyC') castSkill('c');
      if(e.code === 'KeyV') toggleTransformation();
      if(e.code === 'KeyE') interactNPCs();
      if(e.code === 'Space' && playerData.isGrounded) {
        playerData.vy = 0.4; playerData.isGrounded = false;
      }
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    function getPlayerForward() {
      const dir = new THREE.Vector3(0, 0, -1);
      dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);
      return dir;
    }

    // --- TRANSFORMAÇÃO ---
    function toggleTransformation() {
      const fruit = FRUITS[playerData.currentFruit];
      if(!fruit.hasTransformation) {
        showCenterMsg("Esta fruta não possui transformação!");
        return;
      }

      playerData.isTransformed = !playerData.isTransformed;

      if(playerData.currentFruit === 'phoenix') {
        if(playerData.isTransformed) {
          player.humanMesh.visible = false;
          player.phoenixMesh.visible = true;
          playSound('phoenix');
          showCenterMsg("FÊNIX ANCESTRAL RENASCIDA!");
        } else {
          player.humanMesh.visible = true;
          player.phoenixMesh.visible = false;
          showCenterMsg("FORMA HUMANA");
        }
      }
    }

    // --- EXECUÇÃO DE SKILLS DETALHADAS ---
    function castSkill(slot) {
      if(playerData.isAttacking) return;
      playerData.isAttacking = true;

      const fruit = playerData.currentFruit;
      const mult = playerData.isTransformed ? 2.0 : 1.0;
      const fwd = getPlayerForward();

      if(fruit === 'phoenix') {
        if(slot==='z') phoenixZ(fwd, mult);
        if(slot==='x') phoenixX(fwd, mult);
        if(slot==='c') phoenixC(fwd, mult);
      } else if(fruit === 'distortion') {
        if(slot==='z') distortionZ(fwd);
        if(slot==='x') distortionX(fwd);
        if(slot==='c') distortionC(fwd);
      } else if(fruit === 'sound') {
        if(slot==='z') soundZ(fwd);
        if(slot==='x') soundX(fwd);
        if(slot==='c') soundC(fwd);
      } else if(fruit === 'shadow') {
        if(slot==='z') shadowZ(fwd);
        if(slot==='x') shadowX(fwd);
        if(slot==='c') shadowC(fwd);
      }
    }

    // FÊNIX
    function phoenixZ(fwd, mult) {
      playSound('phoenix');
      const slash = new THREE.Mesh(new THREE.TorusGeometry(2 * mult, 0.2, 8, 24, Math.PI), new THREE.MeshBasicMaterial({ color: 0x00f3ff }));
      slash.rotation.x = Math.PI / 2;
      const pos = player.position.clone().add(fwd.clone().multiplyScalar(3));
      slash.position.copy(pos);
      scene.add(slash);

      applyDamage(pos, 4 * mult, 65 * mult);
      setTimeout(() => { scene.remove(slash); playerData.isAttacking = false; }, 300);
    }

    function phoenixX(fwd, mult) {
      playSound('phoenix');
      const healZone = new THREE.Mesh(new THREE.CylinderGeometry(5 * mult, 5 * mult, 1, 16), new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.6 }));
      healZone.position.copy(player.position);
      scene.add(healZone);

      // Cura o jogador
      playerData.hp = Math.min(playerData.maxHp, playerData.hp + 40);
      showCenterMsg("REGENERAÇÃO DE CHAMA BLUE! +40 HP");
      applyDamage(player.position, 6 * mult, 50 * mult);
      updateUI();

      setTimeout(() => { scene.remove(healZone); playerData.isAttacking = false; }, 500);
    }

    function phoenixC(fwd, mult) {
      playSound('phoenix');
      const wings = new THREE.Mesh(new THREE.BoxGeometry(8 * mult, 0.2, 3), new THREE.MeshBasicMaterial({ color: 0xffd700 }));
      wings.position.copy(player.position);
      scene.add(wings);

      // Impulso Aéreo
      player.position.add(fwd.clone().multiplyScalar(10));
      applyDamage(player.position, 8 * mult, 110 * mult);

      setTimeout(() => { scene.remove(wings); playerData.isAttacking = false; }, 400);
    }

    // DISTORÇÃO ESPACIAL
    function distortionZ(fwd) {
      playSound('distortion');
      const portal = new THREE.Mesh(new THREE.RingGeometry(0.5, 2.5, 16), new THREE.MeshBasicMaterial({ color: 0x9900ff, side: THREE.DoubleSide }));
      const pos = player.position.clone().add(fwd.clone().multiplyScalar(4));
      portal.position.copy(pos);
      scene.add(portal);

      applyDamage(pos, 4, 70);
      setTimeout(() => { scene.remove(portal); playerData.isAttacking = false; }, 350);
    }

    function distortionX(fwd) {
      playSound('distortion');
      const hole = new THREE.Mesh(new THREE.SphereGeometry(3, 16, 16), new THREE.MeshBasicMaterial({ color: 0x220044 }));
      const pos = player.position.clone().add(fwd.clone().multiplyScalar(6));
      hole.position.copy(pos);
      scene.add(hole);

      // Puxa Inimigos
      enemies.forEach(e => {
        if(e.position.distanceTo(pos) < 12) e.position.lerp(pos, 0.7);
      });

      applyDamage(pos, 6, 95);
      setTimeout(() => { scene.remove(hole); playerData.isAttacking = false; }, 500);
    }

    function distortionC(fwd) {
      playSound('distortion');
      if(enemies.length > 0) {
        const target = enemies[0];
        const tempPos = player.position.clone();
        player.position.copy(target.position);
        target.position.copy(tempPos);
        showCenterMsg("TROCA DE MATÉRIA!");
      }
      playerData.isAttacking = false;
    }

    // SOM SÔNICO
    function soundZ(fwd) {
      playSound('sound');
      const wave = new THREE.Mesh(new THREE.RingGeometry(1, 4, 16), new THREE.MeshBasicMaterial({ color: 0xffff00, side: THREE.DoubleSide }));
      wave.rotation.x = -Math.PI / 2;
      const pos = player.position.clone().add(fwd.clone().multiplyScalar(3));
      wave.position.copy(pos);
      scene.add(wave);

      applyDamage(pos, 5, 60);
      setTimeout(() => { scene.remove(wave); playerData.isAttacking = false; }, 300);
    }

    function soundX(fwd) {
      playSound('sound');
      const pulse = new THREE.Mesh(new THREE.CylinderGeometry(6, 6, 0.5, 16), new THREE.MeshBasicMaterial({ color: 0xffaa00 }));
      pulse.position.copy(player.position);
      scene.add(pulse);

      applyDamage(player.position, 7, 85);
      setTimeout(() => { scene.remove(pulse); playerData.isAttacking = false; }, 400);
    }

    function soundC(fwd) {
      playSound('sound');
      const beam = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 15, 12), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      beam.rotation.x = Math.PI / 2;
      const pos = player.position.clone().add(fwd.clone().multiplyScalar(7));
      beam.position.copy(pos);
      scene.add(beam);

      applyDamage(pos, 4, 125);
      setTimeout(() => { scene.remove(beam); playerData.isAttacking = false; }, 450);
    }

    // SOMBRA UMBRÁTICA
    function shadowZ(fwd) {
      playSound('shadow');
      player.position.add(fwd.clone().multiplyScalar(8));
      const shadowStrike = new THREE.Mesh(new THREE.BoxGeometry(2, 4, 2), new THREE.MeshBasicMaterial({ color: 0x110022 }));
      shadowStrike.position.copy(player.position);
      scene.add(shadowStrike);

      applyDamage(player.position, 4, 80);
      setTimeout(() => { scene.remove(shadowStrike); playerData.isAttacking = false; }, 300);
    }

    function shadowX(fwd) {
      playSound('shadow');
      const tentacles = new THREE.Group();
      for(let i=0; i<4; i++) {
        const t = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.6, 5), new THREE.MeshBasicMaterial({ color: 0x330066 }));
        t.position.set((i-1.5)*1.5, 2.5, 0);
        tentacles.add(t);
      }
      const pos = player.position.clone().add(fwd.clone().multiplyScalar(4));
      tentacles.position.copy(pos);
      scene.add(tentacles);

      applyDamage(pos, 5, 90);
      setTimeout(() => { scene.remove(tentacles); playerData.isAttacking = false; }, 500);
    }

    function shadowC(fwd) {
      playSound('shadow');
      const eclipse = new THREE.Mesh(new THREE.SphereGeometry(14, 16, 16), new THREE.MeshBasicMaterial({ color: 0x050010, transparent: true, opacity: 0.85 }));
      eclipse.position.copy(player.position);
      scene.add(eclipse);

      applyDamage(player.position, 14, 130);
      setTimeout(() => { scene.remove(eclipse); playerData.isAttacking = false; }, 700);
    }

    function applyDamage(pos, radius, damage) {
      enemies.forEach(e => {
        if(e.position.distanceTo(pos) <= radius) {
          e.hp -= damage;
          if(e.hp <= 0) {
            e.position.set(e.spawnPos.x, GROUND_Y, e.spawnPos.z);
            e.hp = e.maxHp;
            addXP(60);
            playerData.beli += 120;

            if(playerData.questActive) {
              playerData.questKills++;
              if(playerData.questKills >= 3) {
                playerData.questActive = false;
                addXP(200);
                playerData.beli += 500;
                showCenterMsg("MISSÃO CONCLUÍDA! +$500");
              }
              updateUI();
            }
          }
        }
      });
    }

    // --- LOOP & ANIMAÇÕES ---
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      let moveX = 0, moveZ = 0;
      if(keys['KeyW']) moveZ -= 1;
      if(keys['KeyS']) moveZ += 1;
      if(keys['KeyA']) moveX -= 1;
      if(keys['KeyD']) moveX += 1;

      const isMoving = moveX !== 0 || moveZ !== 0;

      if(isMoving) {
        const angle = Math.atan2(moveX, moveZ);
        player.rotation.y = angle;
        player.position.x += Math.sin(angle) * playerData.speed;
        player.position.z += Math.cos(angle) * playerData.speed;
      }

      // Gravidade
      playerData.vy -= 0.018;
      player.position.y += playerData.vy;
      if(player.position.y <= GROUND_Y) {
        player.position.y = GROUND_Y;
        playerData.vy = 0;
        playerData.isGrounded = true;
      }

      // Animação Pernas e Braços Humano
      if(player.humanMesh.visible) {
        if(isMoving) {
          player.legL.rotation.x = -Math.sin(time * 12) * 0.7;
          player.legR.rotation.x = Math.sin(time * 12) * 0.7;
          player.armL.rotation.x = Math.sin(time * 12) * 0.6;
          player.armR.rotation.x = -Math.sin(time * 12) * 0.6;
        } else {
          player.legL.rotation.x = 0; player.legR.rotation.x = 0;
          player.armL.rotation.x = 0; player.armR.rotation.x = 0;
        }
      }

      // Animação Bater de Asas Fênix
      if(player.phoenixMesh.visible) {
        player.phoenixMesh.wingL.rotation.z = Math.sin(time * 8) * 0.4;
        player.phoenixMesh.wingR.rotation.z = -Math.sin(time * 8) * 0.4;
      }

      // Inimigos
      enemies.forEach(e => {
        e.legL.rotation.x = Math.sin(time * 8) * 0.3;
        e.legR.rotation.x = -Math.sin(time * 8) * 0.3;
      });

      // Câmera
      camera.position.set(player.position.x, player.position.y + 8, player.position.z + 14);
      camera.lookAt(player.position.x, player.position.y + 1, player.position.z);

      renderer.render(scene, camera);
    }

    function interactNPCs() {
      if(player.position.distanceTo(npcQuest.position) < 4) {
        playerData.questActive = true;
        playerData.questKills = 0;
        showCenterMsg("MISSÃO ACEITA: Derrote 3 Bandidos");
        updateUI();
      }

      if(player.position.distanceTo(npcGacha.position) < 4) {
        if(playerData.beli < 500) {
          showCenterMsg("BELI INSUFICIENTE! ($500)");
          return;
        }
        playerData.beli -= 500;
        const keysArr = Object.keys(FRUITS);
        const randomKey = keysArr[Math.floor(Math.random() * keysArr.length)];
        playerData.currentFruit = randomKey;

        if(playerData.isTransformed) toggleTransformation();
        showCenterMsg(`GIRO DE FRUTA: ${FRUITS[randomKey].name.toUpperCase()}!`);
        updateUI();
      }
    }

    function addXP(amount) {
      playerData.xp += amount;
      if(playerData.xp >= playerData.maxXp) {
        playerData.level++;
        playerData.xp = 0;
        playerData.maxXp = Math.floor(playerData.maxXp * 1.5);
        playerData.maxHp += 20;
        playerData.hp = playerData.maxHp;
        showCenterMsg("LEVEL UP! NV " + playerData.level);
      }
      updateUI();
    }

    function showCenterMsg(text) {
      const msg = document.getElementById('center-msg');
      msg.innerText = text;
      msg.style.opacity = 1;
      setTimeout(() => msg.style.opacity = 0, 2200);
    }

    function updateUI() {
      const fruit = FRUITS[playerData.currentFruit];
      document.getElementById('lbl-level').innerText = playerData.level;
      document.getElementById('lbl-fruit').innerText = fruit.name;
      document.getElementById('lbl-hp').innerText = `${Math.floor(playerData.hp)}/${playerData.maxHp}`;
      document.getElementById('lbl-beli').innerText = playerData.beli;
      
      document.getElementById('hp-bar').style.width = `${(playerData.hp / playerData.maxHp) * 100}%`;
      document.getElementById('xp-bar').style.width = `${(playerData.xp / playerData.maxXp) * 100}%`;

      document.getElementById('slot-z').innerText = fruit.skills.z;
      document.getElementById('slot-x').innerText = fruit.skills.x;
      document.getElementById('slot-c').innerText = fruit.skills.c;
      document.getElementById('slot-v').innerText = fruit.skills.v;

      const questDesc = document.getElementById('quest-desc');
      const questProg = document.getElementById('quest-prog');
      if(playerData.questActive) {
        questDesc.innerText = "Derrote os Bandidos na ilha.";
        questProg.innerText = `Progresso: ${playerData.questKills}/3 Bandidos`;
      } else {
        questDesc.innerText = "Fale com o NPC de Missões (Azul).";
        questProg.innerText = "Nenhuma missão ativa";
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    updateUI();
    animate();
  </script>
</body>
</html>
