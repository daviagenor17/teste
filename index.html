<style>
* {
    box-sizing: border-box;

}

html, body {
    margin: 0;

    height: 100%;

canvas {

#ui {
    position: fixed;

}

#topLeft {
    position: absolute;

}

.panel {
    background: rgba(8, 14, 25, .82);
    border: 1px solid rgba(255,255,255,.15);

#playerName {

.bar {

}

#healthFill {
    width: 100%;
    height: 100%;

}

#xpFill {
    width: 0%;
    height: 100%;

}

.smallText {
    font-size: 12px;

}

#stats {

}

#questBox {

    top: 20px;
    width: 280px;

}

#questTitle {
    font-weight: bold;
    color: #ffd75e;
}

#questProgress {
    margin-top: 7px;
    font-size: 13px;
}

#hotbar {
    position: absolute;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
}

.slot {
    width: 88px;
    height: 88px;
    background: rgba(10,15,25,.88);
    border: 2px solid rgba(255,255,255,.12);
    border-radius: 12px;
    position: relative;

    align-items: center;
    justify-content: center;
    flex-direction: column;
    transition: .15s;
    box-shadow: 0 5px 20px rgba(0,0,0,.3);
}

.slot.active {
    border-color: #ffd54d;
    transform: translateY(-8px);
    box-shadow: 0 0 25px rgba(255,213,77,.35);
}

.slot .number {

    top: 5px;
    left: 7px;

    color: #ffd54d;
}

.slot .icon {
    font-size: 27px;
}

.slot .skill {
    font-size: 10px;

    text-align: center;
    max-width: 78px;
}

#fruitInfo {
    position: absolute;
    left: 50%;
    bottom: 122px;
    transform: translateX(-50%);

    border-radius: 20px;

#interaction {
    position: absolute;
    left: 50%;
    top: 55%;

    border-radius: 10px;

}

#message {

#crosshair {

function box(
    w,
    h,
    d,
    color,
    x=0,
    y=0,
    z=0
) {

    const geo =
        new THREE.BoxGeometry(w,h,d);

    const mat =
        new THREE.MeshStandardMaterial({
            color,
            roughness:.8
        });

    const mesh =
        new THREE.Mesh(geo,mat);

    mesh.position.set(x,y,z);

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    return mesh;
}

function sphere(
    r,
    color,
    x=0,
    y=0,
    z=0
) {

    const geo =
        new THREE.SphereGeometry(
            r,
            24,
            16
        );

    const mat =
        new THREE.MeshStandardMaterial({
            color,
            roughness:.65
        });

    const mesh =
        new THREE.Mesh(geo,mat);

    mesh.position.set(x,y,z);

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    return mesh;
}

function cylinder(
    r,
    h,
    color,
    x=0,
    y=0,
    z=0
) {

    const geo =
        new THREE.CylinderGeometry(

    mesh.position.set(x,y,z);

    mesh.receiveShadow = true;

    scene.add(mesh);

    return mesh;
}

const clouds = [];

function cloud(x,y,z){

    const g =
        new THREE.Group();

    for(let i=0;i<7;i++){

        const c =
            sphere(
                5 + Math.random()*3,
                0xffffff,
                (i-3)*4,
                Math.random()*2,
                Math.sin(i)*4
            );

        c.castShadow = false;

        g.add(c);
    }

    g.position.set(x,y,z);

    scene.add(g);

    clouds.push(g);
}

function createCharacter(color=0x3498db){

    const root =

        7.1,

    );

    root.add(eye1);

    const eye2 =

        );

        );

    );

    root.add(armR);

    const legL =
        box(

        );

        );

        armR,

        walking:false,

    };

}

/* =========================================================

========================================================= */

const hotbar =

function renderHotbar(){

    hotbar.innerHTML = "";

    currentFruit.skills.forEach(
        (skill,i)=>{

            const slot =
                document.createElement("div");

            slot.className =
                "slot" +
                (i===0 ? " active":"");

/* =========================================================
   PLAYER STATS
========================================================= */

let playerHealth = 100;
let maxHealth = 100;

let level = 1;
let xp = 0;
let xpNeeded = 100;
let money = 500;

let attacking = false;
let transformed = false;

const keys = {};

addEventListener(
    "keydown",
    e => {

        keys[e.code] = true;

        
        if(e.key >= "1" && e.key <= "5"){
            useSkill(Number(e.key) - 1);
        }

        if(e.code === "Space"){
            jump();
        }

        if(e.code === "KeyQ"){
            dodge();
        }

        if(e.code === "KeyE"){
            interact();
        }

        if(e.code === "ShiftLeft" || e.code === "ShiftRight"){
            sprinting = true;
        }
    }
);

addEventListener(
    "keyup",
    e => {
        keys[e.code] = false;

        if(e.code === "ShiftLeft" || e.code === "ShiftRight"){
            sprinting = false;
        }
    }
);


/* =========================================================
   MOVIMENTO
========================================================= */

let velocityY = 0;
let grounded = true;
let sprinting = false;
let dodging = false;

const gravity = -28;
const walkSpeed = 15;
const sprintSpeed = 25;

function jump(){

    if(!grounded || dodging) return;

    velocityY = 13;
    grounded = false;
}


function dodge(){

    if(dodging) return;

    dodging = true;

    const direction = new THREE.Vector3();

    if(keys.KeyW) direction.z -= 1;
    if(keys.KeyS) direction.z += 1;
    if(keys.KeyA) direction.x -= 1;
    if(keys.KeyD) direction.x += 1;

    if(direction.lengthSq() === 0){
        direction.z = -1;
    }

    direction.normalize();

    const start =
        player.position.clone();

    const end =
        start.clone().add(
            direction.multiplyScalar(9)
        );

    let t = 0;

    function dash(){

        t += .12;

        player.position.lerp(
            end,
            .35
        );

        if(t < 1){
            requestAnimationFrame(dash);
        }else{
            dodging = false;
        }
    }

    dash();
}


/* =========================================================
   VIDA / XP
========================================================= */

function updateUI(){

    document.getElementById("healthFill").style.width =
        `${Math.max(0, playerHealth / maxHealth * 100)}%`;

    document.getElementById("xpFill").style.width =
        `${Math.min(100, xp / xpNeeded * 100)}%`;

    document.getElementById("level").textContent =
        level;

    document.getElementById("money").textContent =
        money;

    document.getElementById("fruit").textContent =
        currentFruit.name;
}

updateUI();


function gainXP(amount){

    xp += amount;

    while(xp >= xpNeeded){

        xp -= xpNeeded;
        level++;

        xpNeeded =
            Math.floor(
                xpNeeded * 1.35
            );

        maxHealth += 15;
        playerHealth = maxHealth;

        showMessage(
            `LEVEL UP! Nível ${level}`,
            "#ffd54d"
        );
    }

    updateUI();
}


function damagePlayer(amount){

    if(dodging) return;

    playerHealth -= amount;

    updateUI();

    if(playerHealth <= 0){

        playerHealth = maxHealth;

        player.position.set(
            0,
            0,
            15
        );

        showMessage(
            "Você foi derrotado!",
            "#ff4d5d"
        );

        fadeScreen();
    }
}

let messageTimer = null;

function showMessage(text,color="#ffffff"){

    const el =
        document.getElementById("message");

    el.textContent = text;
    el.style.color = color;
    el.style.opacity = "1";

    clearTimeout(messageTimer);

    messageTimer =
        setTimeout(()=>{
            el.style.opacity = "0";
        },1800);
}


/* =========================================================
   FRUTAS / HABILIDADES
========================================================= */

function createEffect(position,color,type="sphere"){

    let mesh;

    if(type === "ring"){

        mesh =
            new THREE.Mesh(
                new THREE.RingGeometry(
                    .5,
                    2.5,
                    32
                ),
                new THREE.MeshBasicMaterial({
                    color,
                    transparent:true,
                    opacity:.9,
                    side:THREE.DoubleSide
                })
            );

        mesh.rotation.x =
            -Math.PI/2;

    }else{

        mesh =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    1,
                    16,
                    12
                ),
                new THREE.MeshBasicMaterial({
                    color,
                    transparent:true,
                    opacity:.8
                })
            );
    }

    mesh.position.copy(position);

    scene.add(mesh);

    let scale = 1;
    let opacity = .8;

    function animateEffect(){

        scale += .12;
        opacity -= .035;

        mesh.scale.setScalar(scale);

        if(mesh.material.opacity !== undefined){
            mesh.material.opacity = opacity;
        }

        if(opacity <= 0){

            scene.remove(mesh);

            if(mesh.geometry) mesh.geometry.dispose();
            if(mesh.material) mesh.material.dispose();

            return;
        }

        requestAnimationFrame(
            animateEffect
        );
    }

    animateEffect();
}


function useSkill(index){

    if(attacking || dodging) return;

    if(index < 0 || index > 4) return;

    attacking = true;

    document
        .querySelectorAll(".slot")
        .forEach((slot,i)=>{
            slot.classList.toggle(
                "active",
                i === index
            );
        });

    const skill =
        currentFruit.skills[index];

    showMessage(
        skill,
        "#" + currentFruit.color
            .toString(16)
            .padStart(6,"0")
    );

    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    forward.applyQuaternion(
        player.quaternion
    );

    const start =
        player.position.clone();

    start.y += 4;

    const power =
        7 + index * 3;

    if(currentFruit === fruits.flame){

        createEffect(
            start.clone().add(
                forward.clone().multiplyScalar(5)
            ),
            0xff3b20
        );

        damageEnemies(
            start,
            forward,
            power,
            18 + index * 12
        );

    }else if(currentFruit === fruits.ice){

        createEffect(
            start.clone().add(
                forward.clone().multiplyScalar(5)
            ),
            0x69dfff
        );

        damageEnemies(
            start,
            forward,
            power + 2,
            15 + index * 10
        );

    }else if(currentFruit === fruits.light){

        createEffect(
            start.clone().add(
                forward.clone().multiplyScalar(7)
            ),
            0xfff36b
        );

        damageEnemies(
            start,
            forward,
            power + 5,
            22 + index * 13
        );

    }else if(currentFruit === fruits.quake){

        createEffect(
            player.position.clone(),
            0x9b6cff,
            "ring"
        );

        damageEnemies(
            start,
            forward,
            14 + index * 3,
            25 + index * 14
        );

    }else if(currentFruit === fruits.beast){

        if(index === 4){

            transformed =
                !transformed;

            if(transformed){

                player.scale.set(
                    1.35,
                    1.35,
                    1.35
                );

                showMessage(
                    "TRANSFORMAÇÃO!",
                    "#55ff66"
                );

            }else{

                player.scale.set(
                    1,
                    1,
                    1
                );
            }

        }else{

            createEffect(
                start.clone().add(
                    forward.clone().multiplyScalar(4)
                ),
                0x55c94f
            );

            damageEnemies(
                start,
                forward,
                power + 3,
                20 + index * 12
            );
        }
    }

    setTimeout(()=>{
        attacking = false;
    },350);
}


/* =========================================================
   DANO NOS INIMIGOS
========================================================= */

function damageEnemies(
    origin,
    direction,
    range,
    damage
){

    enemies.forEach(enemy => {

        if(enemy.userData.dead) return;

        const enemyPos =
            enemy.position.clone();

        enemyPos.y += 3;

        const distance =
            origin.distanceTo(enemyPos);

        if(distance > range) return;

        const toEnemy =
            enemyPos
                .sub(origin)
                .normalize();

        const dot =
            direction.dot(toEnemy);

        if(dot > .15){

            hitEnemy(
                enemy,
                damage
            );
        }
    });
}


function hitEnemy(enemy,damage){

    enemy.userData.health -= damage;

    enemy.userData.hitFlash = .15;

    if(enemy.userData.health <= 0){

        enemy.userData.dead = true;

        gainXP(
            enemy.userData.xp
        );

        money +=
            enemy.userData.money;

        updateUI();

        showMessage(
            `+${enemy.userData.xp} XP  +${enemy.userData.money} Beli`,
            "#ffd54d"
        );

        let timer = 0;

        function deathAnimation(){

            timer += .06;

            enemy.rotation.z += .12;
            enemy.scale.multiplyScalar(.94);

            if(timer < 1){

                requestAnimationFrame(
                    deathAnimation
                );

            }else{

                scene.remove(enemy);

                const index =
                    enemies.indexOf(enemy);

                if(index !== -1){
                    enemies.splice(index,1);
                }

                setTimeout(
                    () => spawnEnemy(),
                    5000
                );
            }
        }

        deathAnimation();
    }
}

/* =========================================================
   MOVIMENTO DO PLAYER
========================================================= */

function updatePlayer(delta){

    if(dodging) return;

    const direction =
        new THREE.Vector3();

    if(keys.KeyW) direction.z -= 1;
    if(keys.KeyS) direction.z += 1;
    if(keys.KeyA) direction.x -= 1;
    if(keys.KeyD) direction.x += 1;

    const moving =
        direction.lengthSq() > 0;

    if(moving){

        direction.normalize();

        const speed =
            sprinting
                ? sprintSpeed
                : walkSpeed;

        player.position.x +=
            direction.x *
            speed *
            delta;

        player.position.z +=
            direction.z *
            speed *
            delta;

        const targetRotation =
            Math.atan2(
                direction.x,
                direction.z
            );

        player.rotation.y =
            THREE.MathUtils.lerp(
                player.rotation.y,
                targetRotation,
                .18
            );
    }

    /* gravidade */

    velocityY +=
        gravity * delta;

    player.position.y +=
        velocityY * delta;

    if(player.position.y <= 0){

        player.position.y = 0;

        velocityY = 0;

        grounded = true;
    }

    /* limite da ilha */

    const distance =
        Math.sqrt(
            player.position.x ** 2 +
            player.position.z ** 2
        );

    if(distance > 64){

        const angle =
            Math.atan2(
                player.position.z,
                player.position.x
            );

        player.position.x =
            Math.cos(angle) * 63;

        player.position.z =
            Math.sin(angle) * 63;
    }

    /* animação */

    const data =
        player.userData;

    if(moving && grounded){

        const walk =
            Math.sin(
                performance.now() * .012
            );

        data.legL.rotation.x =
            walk * .6;

        data.legR.rotation.x =
            -walk * .6;

        data.armL.rotation.x =
            -walk * .45;

        if(!attacking){
            data.armR.rotation.x =
                walk * .45;
        }

        data.body.position.y =
            4.5 +
            Math.abs(walk) * .12;

    }else{

        data.legL.rotation.x *= .8;
        data.legR.rotation.x *= .8;
        data.armL.rotation.x *= .8;

        if(!attacking){
            data.armR.rotation.x *= .8;
        }

        data.body.position.y =
            THREE.MathUtils.lerp(
                data.body.position.y,
                4.5,
                .15
            );
    }
}


/* =========================================================
   IA DOS INIMIGOS
========================================================= */

function updateEnemies(delta){

    enemies.forEach(enemy => {

        if(
            !enemy ||
            enemy.userData.dead
        ) return;

        const distance =
            enemy.position.distanceTo(
                player.position
            );

        if(
            enemy.userData.hitFlash > 0
        ){

            enemy.userData.hitFlash -=
                delta;

            enemy.userData.body.material.color
                .set(0xffffff);

        }else{

            enemy.userData.body.material.color
                .set(enemy.userData.baseColor);
        }

        if(distance < 28){

            const direction =
                player.position
                    .clone()
                    .sub(enemy.position);

            direction.y = 0;

            if(direction.lengthSq() > 0){
                direction.normalize();
            }

            const rotation =
                Math.atan2(
                    direction.x,
                    direction.z
                );

            enemy.rotation.y =
                THREE.MathUtils.lerp(
                    enemy.rotation.y,
                    rotation,
                    .08
                );

            if(distance > 5){

                enemy.position.add(
                    direction.multiplyScalar(
                        5 * delta
                    )
                );

                const walk =
                    Math.sin(
                        performance.now()*.01
                    );

                enemy.userData.legL.rotation.x =
                    walk*.5;

                enemy.userData.legR.rotation.x =
                    -walk*.5;

            }else{

                enemy.userData.attackCooldown -=
                    delta;

                if(
                    enemy.userData.attackCooldown <= 0
                ){

                    damagePlayer(
                        8 + level
                    );

                    enemy.userData.attackCooldown =
                        1.4;
                }
            }
        }
    });
}

/* =========================================================
   ÁGUA ANIMADA
========================================================= */

const oceanPositions =
    ocean.geometry.attributes.position;

function animateOcean(){

    const time =
        performance.now() * .001;

    for(
        let i=0;
        i<oceanPositions.count;
        i++
    ){

        const x =
            oceanPositions.getX(i);

        const z =
            oceanPositions.getY(i);

        const y =
            Math.sin(
                x*.035 + time
            ) * .35 +
            Math.cos(
                z*.04 + time*1.2
            ) * .25;

        oceanPositions.setZ(
            i,
            y
        );
    }

    oceanPositions.needsUpdate = true;

    ocean.geometry.computeVertexNormals();
}
