<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blox Fruits 3D - Skills Detalhadas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; background: #000; }
    
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
    
    #ui {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
    }

    .status-bar {
      background: rgba(15, 15, 25, 0.85); backdrop-filter: blur(8px);
      border: 2px solid #00f3ff; border-radius: 12px; padding: 15px 25px;
      width: 340px; color: #fff;
    }
    .status-title { font-size: 16px; font-weight: 900; color: #00f3ff; margin-bottom: 8px; text-transform: uppercase; }
    .bar-container { background: #222; height: 14px; border-radius: 8px; overflow: hidden; margin-bottom: 6px; border: 1px solid #444; }
    .hp-bar { background: linear-gradient(90deg, #ff0055, #ff5500); width: 100%; height: 100%; transition: width 0.2s; }
    .xp-bar { background: linear-gradient(90deg, #00f3ff, #0055ff); width: 0%; height: 100%; transition: width 0.2s; }
    .info-text { font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; color: #ccc; }

    .quest-panel {
      position: absolute; top: 20px; right: 20px;
      background: rgba(15, 15, 25, 0.85); border: 2px solid #ffaa00;
      border-radius: 12px; padding: 15px; width: 260px; color: #fff;
    }
    .quest-title { color: #ffaa00; font-weight: 900; font-size: 16px; margin-bottom: 5px; }

    .hotbar-container {
      align-self: center; display: flex; gap: 12px; margin-bottom: 15px;
      background: rgba(10, 10, 20, 0.85); padding: 10px 20px; border-radius: 15px;
      border: 2px solid rgba(0, 243, 255, 0.3);
    }
    .hotbar-slot {
      background: rgba(20, 20, 35, 0.9); border: 2px solid #00f3ff;
      border-radius: 10px; padding: 10px; width: 110px; text-align: center; color: #fff;
    }
    .skill-key { font-size: 18px; font-weight: 900; color: #00f3ff; }
    .skill-name { font-size: 11px; font-weight: bold; margin-top: 4px; text-transform: uppercase; color: #fff; }

    .controls-guide {
      position: absolute; bottom: 20px; left: 20px;
      background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px;
      color: #aaa; font-size: 12px; border: 1px solid #333;
    }

    #center-msg {
      position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%);
      font-size: 28px; font-weight: 900; color: #ffd700; text-shadow: 0 0 20px #ff0055;
      opacity: 0; transition: opacity 0.3s; text-transform: uppercase; text-align: center; pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="ui">
    <div class="status-bar">
      <div class="status-title">Nível <span id="lbl-level">1</span> | Fruta: <span id="lbl-fruit" style="color:#ffaa00">Chama</span></div>
      <div class="bar-container"><div id="hp-bar" class="hp-bar"></div></div>
      <div class="bar-container"><div id="xp-bar" class="xp-bar"></div></div>
      <div class="info-text">
        <span>HP: <span id="lbl-hp">100/100</span></span>
        <span>Beli: $<span id="lbl-beli">1000</span></span>
      </div>
    </div>

    <div class="quest-panel">
      <div class="quest-title">📜 Missão Atual</div>
      <div id="quest-desc" style="font-size: 13px; color: #ddd;">Fale com o NPC Azul.</div>
      <div style="font-size: 12px; color: #ffaa00; margin-top: 8px;" id="quest-prog">Progresso: 0/3 Bandidos</div>
    </div>

    <div id="center-msg">MENSAGEM</div>

    <div class="hotbar-container">
      <div class="hotbar-slot"><div class="skill-key">Z</div><div class="skill-name" id="slot-z">Soco Fogo</div></div>
      <div class="hotbar-slot"><div class="skill-key">X</div><div class="skill-name" id="slot-x">Sopro Fogo</div></div>
      <div class="hotbar-slot"><div class="skill-key">C</div><div class="skill-name" id="slot-c">Meteoro</div></div>
    </div>

    <div class="controls-guide">
      <b>Movimento:</b> WASD | <b>Ataques:</b> Z, X, C | <b>Interagir (NPCs):</b> E<br>
      <span style="color:#ff00ea">NPC Roxo: Giro de Fruta ($500)</span> | <span style="color:#0055ff">NPC Azul: Missão</span>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // --- AUDIO SINTETIZADO ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    function playSound(type) {
      if(!audioCtx) audioCtx = new AudioCtx();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if(type==='hit') {
        osc.type = 'square'; osc.frequency.setValueAtTime(150, now);
        gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now+0.1);
        osc.start(now); osc.stop(now+0.1);
      } else if(type==='fire') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(90, now+0.35);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now+0.35);
        osc.start(now); osc.stop(now+0.35);
      } else if(type==='ice') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(900, now);
        osc.frequency.exponentialRampToValueAtTime(150, now+0.3);
        gain.gain.setValueAtTime(0.25, now); gain.gain.linearRampToValueAtTime(0.01, now+0.3);
        osc.start(now); osc.stop(now+0.3);
      } else if(type==='light') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(1200, now);
        osc.frequency.exponentialRampToValueAtTime(400, now+0.2);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now+0.2);
        osc.start(now); osc.stop(now+0.2);
      } else if(type==='buddha') {
        osc.type = 'square'; osc.frequency.setValueAtTime(80, now);
        osc.frequency.linearRampToValueAtTime(200, now+0.4);
        gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0.01, now+0.4);
        osc.start(now); osc.stop(now+0.4);
      } else if(type==='gacha') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(900, now+0.5);
        gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0.01, now+0.5);
        osc.start(now); osc.stop(now+0.5);
      }
    }

    // --- CONFIGURAÇÃO DE FRUTAS ---
    const FRUITS = {
      flame: {
        name: "Chama", color: 0xff4500,
        skills: { z: "Punho de Fogo", x: "Sopro Vulcânico", c: "Meteoro Solar" }
      },
      ice: {
        name: "Gelo", color: 0x00ffff,
        skills: { z: "Lança Congelante", x: "Prisão Glacial", c: "Era do Gelo" }
      },
      light: {
        name: "Luz", color: 0xffff00,
        skills: { z: "Feixe de Luz", x: "Explosão Solar", c: "Chuva Estelar" }
      },
      buddha: {
        name: "Buddha", color: 0xffaa00,
        skills: { z: "Palma Gigante", x: "Onda Dourada", c: "Pilar Divino" }
      }
    };

    // --- SCENA E CÂMERA ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x50b0ff);
    scene.fog = new THREE.FogExp2(0x50b0ff, 0.012);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(50, 80, 50);
    scene.add(dirLight);

    // --- CONSTRUTOR DE PERSONAGEM ROBLOX ---
    function createRobloxCharacter(colorBody, colorShirt) {
      const group = new THREE.Group();
      const matSkin = new THREE.MeshStandardMaterial({ color: colorBody, roughness: 0.5 });
      const matShirt = new THREE.MeshStandardMaterial({ color: colorShirt, roughness: 0.5 });

      const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), matSkin);
      head.position.y = 1.4;
      group.add(head);

      const torso = new THREE.Mesh(new THREE.BoxGeometry(1, 1.2, 0.5), matShirt);
      torso.position.y = 0.4;
      group.add(torso);

      const armL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), matShirt);
      armL.position.set(-0.7, 0.4, 0);
      group.add(armL);
      const armR = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), matShirt);
      armR.position.set(0.7, 0.4, 0);
      group.add(armR);

      const legL = new THREE.Mesh(new THREE.BoxGeometry(0.45, 1.2, 0.45), matSkin);
      legL.position.set(-0.25, -0.8, 0);
      group.add(legL);
      const legR = new THREE.Mesh(new THREE.BoxGeometry(0.45, 1.2, 0.45), matSkin);
      legR.position.set(0.25, -0.8, 0);
      group.add(legR);

      group.armR = armR;
      group.armL = armL;
      group.torso = torso;
      group.head = head;
      return group;
    }

    // --- MUNDO ---
    const ocean = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshStandardMaterial({ color: 0x004488, roughness: 0.2 }));
    ocean.rotation.x = -Math.PI / 2;
    ocean.position.y = -1;
    scene.add(ocean);

    const island = new THREE.Mesh(new THREE.CylinderGeometry(40, 45, 4, 32), new THREE.MeshStandardMaterial({ color: 0x22aa33, roughness: 0.8 }));
    island.position.y = 1;
    scene.add(island);

    // NPC DE MISSÕES (AZUL)
    const npcQuest = createRobloxCharacter(0xffcc99, 0x0055ff);
    npcQuest.position.set(-6, 4, -8);
    scene.add(npcQuest);

    // NPC DO GIRO DE FRUTAS (ROXO)
    const npcGacha = createRobloxCharacter(0xffcc99, 0x9900ff);
    npcGacha.position.set(6, 4, -8);
    scene.add(npcGacha);

    const markerGacha = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff00ea }));
    markerGacha.position.set(6, 6.5, -8);
    scene.add(markerGacha);

    // --- JOGADOR ---
    const player = createRobloxCharacter(0xffcc99, 0xff2200);
    player.position.set(0, 4, 10);
    scene.add(player);

    const playerData = {
      level: 1, xp: 0, maxXp: 100,
      hp: 100, maxHp: 100, beli: 1000,
      questActive: false, questKills: 0,
      currentFruit: 'flame',
      speed: 0.25, isAttacking: false
    };

    // INIMIGOS
    const enemies = [];
    function spawnEnemy(x, z) {
      const enemy = createRobloxCharacter(0xffcc99, 0x333333);
      enemy.position.set(x, 4, z);
      enemy.hp = 70; enemy.maxHp = 70;
      enemy.spawnPos = { x, z };
      scene.add(enemy);
      enemies.push(enemy);
    }
    spawnEnemy(12, 5);
    spawnEnemy(-12, 0);
    spawnEnemy(15, -10);

    // CONTROLES
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if(e.code === 'KeyZ') castSkill('z');
      if(e.code === 'KeyX') castSkill('x');
      if(e.code === 'KeyC') castSkill('c');
      if(e.code === 'KeyE') interactNPCs();
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    function getForwardVector() {
      const dir = new THREE.Vector3(0, 0, -1);
      dir.applyQuaternion(player.quaternion);
      return dir;
    }

    // --- HABILIDADES DETALHADAS DE CADA FRUTA ---
    function castSkill(slot) {
      if(playerData.isAttacking) return;
      playerData.isAttacking = true;

      const fruit = playerData.currentFruit;
      if(fruit === 'flame') {
        if(slot==='z') skillFlameZ();
        if(slot==='x') skillFlameX();
        if(slot==='c') skillFlameC();
      } else if(fruit === 'ice') {
        if(slot==='z') skillIceZ();
        if(slot==='x') skillIceX();
        if(slot==='c') skillIceC();
      } else if(fruit === 'light') {
        if(slot==='z') skillLightZ();
        if(slot==='x') skillLightX();
        if(slot==='c') skillLightC();
      } else if(fruit === 'buddha') {
        if(slot==='z') skillBuddhaZ();
        if(slot==='x') skillBuddhaX();
        if(slot==='c') skillBuddhaC();
      }
    }

    // 1. CHAMA (FLAME)
    function skillFlameZ() {
      playSound('fire');
      player.armR.rotation.x = -Math.PI / 2;

      const fistMat = new THREE.MeshBasicMaterial({ color: 0xff4500 });
      const fistMesh = new THREE.Mesh(new THREE.SphereGeometry(1.2, 8, 8), fistMat);
      fistMesh.position.set(player.position.x, player.position.y + 0.5, player.position.z - 1.5);
      scene.add(fistMesh);

      applyDamageInArea(fistMesh.position, 4, 30);

      setTimeout(() => {
        scene.remove(fistMesh);
        player.armR.rotation.x = 0;
        playerData.isAttacking = false;
      }, 300);
    }

    function skillFlameX() {
      playSound('fire');
      const cones = [];
      for(let i=0; i<3; i++) {
        const coneMat = new THREE.MeshBasicMaterial({ color: 0xff5500, transparent: true, opacity: 0.8 });
        const cone = new THREE.Mesh(new THREE.ConeGeometry(1 + i*0.8, 4 + i*2, 8), coneMat);
        cone.rotation.x = -Math.PI / 2;
        cone.position.set(player.position.x, player.position.y, player.position.z - (3 + i*2));
        scene.add(cone);
        cones.push(cone);
      }

      applyDamageInArea(player.position.clone().add(new THREE.Vector3(0,0,-5)), 6, 50);

      setTimeout(() => {
        cones.forEach(c => scene.remove(c));
        playerData.isAttacking = false;
      }, 450);
    }

    function skillFlameC() {
      playSound('fire');
      const meteorMat = new THREE.MeshStandardMaterial({ color: 0xff1100, emissive: 0xff3300 });
      const meteor = new THREE.Mesh(new THREE.SphereGeometry(2.5, 16, 16), meteorMat);
      const targetPos = player.position.clone().add(new THREE.Vector3(0, 0, -8));
      meteor.position.set(targetPos.x, targetPos.y + 18, targetPos.z);
      scene.add(meteor);

      let step = 0;
      const interval = setInterval(() => {
        meteor.position.y -= 0.9;
        step++;
        if(meteor.position.y <= 3) {
          clearInterval(interval);
          scene.remove(meteor);
          playSound('hit');

          // Impacto e Anel de Fogo no Chão
          const explosion = new THREE.Mesh(new THREE.RingGeometry(0.1, 7, 16), new THREE.MeshBasicMaterial({ color: 0xff4500, side: THREE.DoubleSide }));
          explosion.rotation.x = -Math.PI / 2;
          explosion.position.set(targetPos.x, 2.1, targetPos.z);
          scene.add(explosion);

          applyDamageInArea(targetPos, 8, 90);

          setTimeout(() => { scene.remove(explosion); playerData.isAttacking = false; }, 400);
        }
      }, 20);
    }

    // 2. GELO (ICE)
    function skillIceZ() {
      playSound('ice');
      const spikeMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
      const spike = new THREE.Mesh(new THREE.ConeGeometry(0.6, 5, 6), spikeMat);
      spike.rotation.x = -Math.PI / 2;
      spike.position.set(player.position.x, player.position.y, player.position.z - 1);
      scene.add(spike);

      let dist = 0;
      const interval = setInterval(() => {
        spike.position.z -= 0.6;
        dist += 0.6;
        applyDamageInArea(spike.position, 2.5, 35);
        if(dist >= 12) {
          clearInterval(interval);
          scene.remove(spike);
          playerData.isAttacking = false;
        }
      }, 20);
    }

    function skillIceX() {
      playSound('ice');
      const iceGroup = new THREE.Group();
      for(let i=0; i<8; i++) {
        const angle = (i / 8) * Math.PI * 2;
        const spike = new THREE.Mesh(new THREE.ConeGeometry(0.8, 4, 5), new THREE.MeshBasicMaterial({ color: 0x88ffff }));
        spike.position.set(Math.cos(angle)*4, 1.5, Math.sin(angle)*4);
        iceGroup.add(spike);
      }
      iceGroup.position.copy(player.position);
      scene.add(iceGroup);

      applyDamageInArea(player.position, 6, 55);

      setTimeout(() => {
        scene.remove(iceGroup);
        playerData.isAttacking = false;
      }, 600);
    }

    function skillIceC() {
      playSound('ice');
      const iceField = new THREE.Mesh(new THREE.CylinderGeometry(10, 10, 0.4, 16), new THREE.MeshBasicMaterial({ color: 0x00e1ff, transparent: true, opacity: 0.8 }));
      iceField.position.set(player.position.x, 2.2, player.position.z);
      scene.add(iceField);

      applyDamageInArea(player.position, 10, 95);

      setTimeout(() => {
        scene.remove(iceField);
        playerData.isAttacking = false;
      }, 700);
    }

    // 3. LUZ (LIGHT)
    function skillLightZ() {
      playSound('light');
      const beamMat = new THREE.MeshBasicMaterial({ color: 0xffffaa });
      const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 16, 8), beamMat);
      beam.rotation.x = -Math.PI / 2;
      beam.position.set(player.position.x, player.position.y + 0.5, player.position.z - 8);
      scene.add(beam);

      applyDamageInArea(beam.position, 4, 40);

      setTimeout(() => {
        scene.remove(beam);
        playerData.isAttacking = false;
      }, 200);
    }

    function skillLightX() {
      playSound('light');
      const flash = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.9 }));
      flash.position.copy(player.position);
      scene.add(flash);

      let scale = 1;
      const interval = setInterval(() => {
        scale += 0.8;
        flash.scale.set(scale, scale, scale);
        applyDamageInArea(player.position, scale, 60);
        if(scale >= 7) {
          clearInterval(interval);
          scene.remove(flash);
          playerData.isAttacking = false;
        }
      }, 25);
    }

    function skillLightC() {
      playSound('light');
      const spears = [];
      const targetCenter = player.position.clone().add(new THREE.Vector3(0,0,-8));

      for(let i=0; i<6; i++) {
        const spear = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.4, 6, 6), new THREE.MeshBasicMaterial({ color: 0xffff55 }));
        const offsetX = (Math.random() - 0.5) * 8;
        const offsetZ = (Math.random() - 0.5) * 8;
        spear.position.set(targetCenter.x + offsetX, targetCenter.y + 12, targetCenter.z + offsetZ);
        scene.add(spear);
        spears.push(spear);
      }

      const interval = setInterval(() => {
        spears.forEach(s => s.position.y -= 1);
        if(spears[0].position.y <= 2) {
          clearInterval(interval);
          spears.forEach(s => scene.remove(s));
          playSound('hit');
          applyDamageInArea(targetCenter, 8, 105);
          playerData.isAttacking = false;
        }
      }, 20);
    }

    // 4. BUDDHA
    function skillBuddhaZ() {
      playSound('buddha');
      // Transforma temporariamente o braço em gigante
      player.armR.scale.set(3, 3, 3);
      player.armR.rotation.x = -Math.PI / 2;

      applyDamageInArea(player.position.clone().add(new THREE.Vector3(0,0,-3)), 5, 50);

      setTimeout(() => {
        player.armR.scale.set(1, 1, 1);
        player.armR.rotation.x = 0;
        playerData.isAttacking = false;
      }, 350);
    }

    function skillBuddhaX() {
      playSound('buddha');
      const ringMat = new THREE.MeshBasicMaterial({ color: 0xffcc00, side: THREE.DoubleSide });
      const ring = new THREE.Mesh(new THREE.RingGeometry(1, 2, 16), ringMat);
      ring.rotation.x = -Math.PI / 2;
      ring.position.set(player.position.x, 2.1, player.position.z);
      scene.add(ring);

      let radius = 2;
      const interval = setInterval(() => {
        radius += 0.8;
        ring.scale.set(radius, radius, radius);
        applyDamageInArea(player.position, radius, 75);
        if(radius >= 8) {
          clearInterval(interval);
          scene.remove(ring);
          playerData.isAttacking = false;
        }
      }, 25);
    }

    function skillBuddhaC() {
      playSound('buddha');
      const pillarMat = new THREE.MeshBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0.85 });
      const pillar = new THREE.Mesh(new THREE.CylinderGeometry(4, 4, 25, 16), pillarMat);
      const targetPos = player.position.clone().add(new THREE.Vector3(0, 0, -6));
      pillar.position.set(targetPos.x, 12, targetPos.z);
      scene.add(pillar);

      applyDamageInArea(targetPos, 7, 120);

      setTimeout(() => {
        scene.remove(pillar);
        playerData.isAttacking = false;
      }, 650);
    }

    // APLICAÇÃO DE DANO GERAL
    function applyDamageInArea(pos, radius, damage) {
      enemies.forEach(e => {
        if(e.position.distanceTo(pos) <= radius) {
          e.hp -= damage;
          if(e.hp <= 0) {
            e.position.set(e.spawnPos.x, 4, e.spawnPos.z);
            e.hp = e.maxHp;
            addXP(45);
            playerData.beli += 80;

            if(playerData.questActive) {
              playerData.questKills++;
              if(playerData.questKills >= 3) {
                playerData.questActive = false;
                addXP(120);
                playerData.beli += 300;
                showCenterMsg("MISSÃO CONCLUÍDA! +$300");
              }
              updateUI();
            }
          }
        }
      });
    }

    // --- NPCS E INTERAÇÕES ---
    function interactNPCs() {
      if(player.position.distanceTo(npcQuest.position) < 4) {
        playerData.questActive = true;
        playerData.questKills = 0;
        showCenterMsg("MISSÃO ACEITA: Derrote 3 Bandidos");
        updateUI();
      }

      if(player.position.distanceTo(npcGacha.position) < 4) {
        if(playerData.beli < 500) {
          showCenterMsg("BELI INSUFICIENTE! ($500)");
          return;
        }

        playerData.beli -= 500;
        playSound('gacha');

        const fruitKeys = Object.keys(FRUITS);
        const randomFruitKey = fruitKeys[Math.floor(Math.random() * fruitKeys.length)];
        playerData.currentFruit = randomFruitKey;

        showCenterMsg(`NOVA FRUTA: ${FRUITS[randomFruitKey].name.toUpperCase()}!`);
        updateUI();
      }
    }

    function addXP(amount) {
      playerData.xp += amount;
      if(playerData.xp >= playerData.maxXp) {
        playerData.level++;
        playerData.xp = 0;
        playerData.maxXp = Math.floor(playerData.maxXp * 1.5);
        playerData.maxHp += 25;
        playerData.hp = playerData.maxHp;
        showCenterMsg("LEVEL UP! NV " + playerData.level);
      }
      updateUI();
    }

    function showCenterMsg(text) {
      const msg = document.getElementById('center-msg');
      msg.innerText = text;
      msg.style.opacity = 1;
      setTimeout(() => msg.style.opacity = 0, 2500);
    }

    function updateUI() {
      const fruit = FRUITS[playerData.currentFruit];
      document.getElementById('lbl-level').innerText = playerData.level;
      document.getElementById('lbl-fruit').innerText = fruit.name;
      document.getElementById('lbl-hp').innerText = `${Math.floor(playerData.hp)}/${playerData.maxHp}`;
      document.getElementById('lbl-beli').innerText = playerData.beli;
      
      document.getElementById('hp-bar').style.width = `${(playerData.hp / playerData.maxHp) * 100}%`;
      document.getElementById('xp-bar').style.width = `${(playerData.xp / playerData.maxXp) * 100}%`;

      document.getElementById('slot-z').innerText = fruit.skills.z;
      document.getElementById('slot-x').innerText = fruit.skills.x;
      document.getElementById('slot-c').innerText = fruit.skills.c;

      const questDesc = document.getElementById('quest-desc');
      const questProg = document.getElementById('quest-prog');
      if(playerData.questActive) {
        questDesc.innerText = "Derrote os Bandidos na ilha.";
        questProg.innerText = `Progresso: ${playerData.questKills}/3 Bandidos`;
      } else {
        questDesc.innerText = "Fale com o NPC de Missões (Azul).";
        questProg.innerText = "Nenhuma missão ativa";
      }
    }

    // --- LOOP PRINCIPAL ---
    function animate() {
      requestAnimationFrame(animate);

      if(keys['KeyW']) player.position.z -= playerData.speed;
      if(keys['KeyS']) player.position.z += playerData.speed;
      if(keys['KeyA']) player.position.x -= playerData.speed;
      if(keys['KeyD']) player.position.x += playerData.speed;

      const dist = Math.hypot(player.position.x, player.position.z);
      if(dist > 38) { player.position.x *= 0.98; player.position.z *= 0.98; }

      camera.position.set(player.position.x, player.position.y + 8, player.position.z + 12);
      camera.lookAt(player.position.x, player.position.y + 1, player.position.z);

      enemies.forEach(enemy => {
        const d = enemy.position.distanceTo(player.position);
        if(d < 12 && d > 1.8) {
          const dir = player.position.clone().sub(enemy.position).normalize();
          enemy.position.x += dir.x * 0.05;
          enemy.position.z += dir.z * 0.05;
        } else if(d <= 1.8) {
          playerData.hp = Math.max(0, playerData.hp - 0.2);
          updateUI();
          if(playerData.hp === 0) {
            player.position.set(0, 4, 10);
            playerData.hp = playerData.maxHp;
            showCenterMsg("VOCÊ MORREU!");
            updateUI();
          }
        }
      });

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    updateUI();
    animate();
  </script>
</body>
</html>
