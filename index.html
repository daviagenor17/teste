<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blox Fruits 3D - Rework Completo & Dragão Real</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; background: #000; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
    #ui {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
    }
    .status-bar {
      background: rgba(15, 15, 25, 0.85); backdrop-filter: blur(8px);
      border: 2px solid #00f3ff; border-radius: 12px; padding: 15px 25px;
      width: 360px; color: #fff;
    }
    .status-title { font-size: 16px; font-weight: 900; color: #00f3ff; margin-bottom: 8px; text-transform: uppercase; }
    .bar-container { background: #222; height: 14px; border-radius: 8px; overflow: hidden; margin-bottom: 6px; border: 1px solid #444; }
    .hp-bar { background: linear-gradient(90deg, #ff0055, #ff5500); width: 100%; height: 100%; transition: width 0.2s; }
    .xp-bar { background: linear-gradient(90deg, #00f3ff, #0055ff); width: 0%; height: 100%; transition: width 0.2s; }
    .info-text { font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; color: #ccc; }
    .quest-panel {
      position: absolute; top: 20px; right: 20px;
      background: rgba(15, 15, 25, 0.85); border: 2px solid #ffaa00;
      border-radius: 12px; padding: 15px; width: 260px; color: #fff;
    }
    .quest-title { color: #ffaa00; font-weight: 900; font-size: 16px; margin-bottom: 5px; }
    .hotbar-container {
      align-self: center; display: flex; gap: 10px; margin-bottom: 15px;
      background: rgba(10, 10, 20, 0.85); padding: 10px 18px; border-radius: 15px;
      border: 2px solid rgba(0, 243, 255, 0.3);
    }
    .hotbar-slot {
      background: rgba(20, 20, 35, 0.9); border: 2px solid #00f3ff;
      border-radius: 10px; padding: 8px; width: 105px; text-align: center; color: #fff;
    }
    .hotbar-slot.transform { border-color: #ff00ea; }
    .skill-key { font-size: 16px; font-weight: 900; color: #00f3ff; }
    .hotbar-slot.transform .skill-key { color: #ff00ea; }
    .skill-name { font-size: 10px; font-weight: bold; margin-top: 3px; text-transform: uppercase; color: #fff; }
    .controls-guide {
      position: absolute; bottom: 20px; left: 20px;
      background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px;
      color: #aaa; font-size: 12px; border: 1px solid #333;
    }
    #center-msg {
      position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%);
      font-size: 28px; font-weight: 900; color: #ffd700; text-shadow: 0 0 20px #ff0055;
      opacity: 0; transition: opacity 0.3s; text-transform: uppercase; text-align: center; pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="ui">
    <div class="status-bar">
      <div class="status-title">Nível <span id="lbl-level">1</span> | Fruta: <span id="lbl-fruit" style="color:#ffaa00">Dragão</span></div>
      <div class="bar-container"><div id="hp-bar" class="hp-bar"></div></div>
      <div class="bar-container"><div id="xp-bar" class="xp-bar"></div></div>
      <div class="info-text">
        <span>HP: <span id="lbl-hp">100/100</span></span>
        <span>Beli: $<span id="lbl-beli">1000</span></span>
      </div>
    </div>

    <div class="quest-panel">
      <div class="quest-title">📜 Missão Atual</div>
      <div id="quest-desc" style="font-size: 13px; color: #ddd;">Fale com o NPC Azul.</div>
      <div style="font-size: 12px; color: #ffaa00; margin-top: 8px;" id="quest-prog">Progresso: 0/3 Bandidos</div>
    </div>

    <div id="center-msg">MENSAGEM</div>

    <div class="hotbar-container">
      <div class="hotbar-slot"><div class="skill-key">Z</div><div class="skill-name" id="slot-z">Skill Z</div></div>
      <div class="hotbar-slot"><div class="skill-key">X</div><div class="skill-name" id="slot-x">Skill X</div></div>
      <div class="hotbar-slot"><div class="skill-key">C</div><div class="skill-name" id="slot-c">Skill C</div></div>
      <div class="hotbar-slot transform"><div class="skill-key">V</div><div class="skill-name" id="slot-v">Transformar</div></div>
    </div>

    <div class="controls-guide">
      <b>Movimento:</b> WASD | <b>Pulo:</b> Espaço | <b>Ataques:</b> Z, X, C | <b>Transformação:</b> V<br>
      <span style="color:#ff00ea">NPC Roxo: Giro ($500)</span> | <span style="color:#0055ff">NPC Azul: Missão</span>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // --- AUDIO SINTETIZADO ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    function playSound(type) {
      if(!audioCtx) audioCtx = new AudioCtx();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if(type==='hit') {
        osc.type = 'square'; osc.frequency.setValueAtTime(140, now);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now+0.1);
        osc.start(now); osc.stop(now+0.1);
      } else if(type==='fire') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(80, now+0.4);
        gain.gain.setValueAtTime(0.35, now); gain.gain.linearRampToValueAtTime(0.01, now+0.4);
        osc.start(now); osc.stop(now+0.4);
      } else if(type==='ice') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(200, now+0.35);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now+0.35);
        osc.start(now); osc.stop(now+0.35);
      } else if(type==='buddha') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(90, now);
        osc.frequency.exponentialRampToValueAtTime(220, now+0.5);
        gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0.01, now+0.5);
        osc.start(now); osc.stop(now+0.5);
      } else if(type==='dragon') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, now);
        osc.frequency.linearRampToValueAtTime(40, now+0.6);
        gain.gain.setValueAtTime(0.45, now); gain.gain.linearRampToValueAtTime(0.01, now+0.6);
        osc.start(now); osc.stop(now+0.6);
      }
    }

    // --- FRUTAS E REWORKS ---
    const FRUITS = {
      dragon: {
        name: "Dragão (Zoan)", color: 0xaa00ff,
        hasTransformation: true,
        skills: { z: "Garra Suprema", x: "Sopro da Besta", c: "Rugido Divino", v: "Transformar" }
      },
      buddha: {
        name: "Buddha", color: 0xffd700,
        hasTransformation: true,
        skills: { z: "Palma Dourada", x: "Onda de Karma", c: "Pilar do Buda", v: "Transformar" }
      },
      flame: {
        name: "Chama", color: 0xff4500,
        hasTransformation: false,
        skills: { z: "Punho de Fogo", x: "Erupção Vulcânica", c: "Meteoro Solar", v: "Indisponível" }
      },
      ice: {
        name: "Gelo", color: 0x00ffff,
        hasTransformation: false,
        skills: { z: "Lança de Gelo", x: "Prisão Glacial", c: "Era do Gelo", v: "Indisponível" }
      }
    };

    // --- CENA ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x3585ff);
    scene.fog = new THREE.FogExp2(0x3585ff, 0.008);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(50, 100, 50);
    scene.add(dirLight);

    // CONSTANTE DE ALTURA DO CHÃO
    const GROUND_Y = 5.2;

    // --- CONSTRUTOR DO PERSONAGEM (PONTOS DE PIVÔ CORRIGIDOS PARA PERNAS NUNCbullet M SUMIREM) ---
    function createRobloxCharacter(colorSkin, colorShirt) {
      const group = new THREE.Group();
      const humanMesh = new THREE.Group();

      const matSkin = new THREE.MeshStandardMaterial({ color: colorSkin, roughness: 0.5 });
      const matShirt = new THREE.MeshStandardMaterial({ color: colorShirt, roughness: 0.5 });

      // Torso (origem y=0.6)
      const torso = new THREE.Mesh(new THREE.BoxGeometry(1, 1.2, 0.5), matShirt);
      torso.position.y = 0.6;
      humanMesh.add(torso);

      // Cabeça
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), matSkin);
      head.position.y = 1.6;
      humanMesh.add(head);

      // Braço Esquerdo
      const armLGroup = new THREE.Group();
      armLGroup.position.set(-0.7, 1.1, 0);
      const armL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), matShirt);
      armL.position.y = -0.5;
      armLGroup.add(armL);
      humanMesh.add(armLGroup);

      // Braço Direito
      const armRGroup = new THREE.Group();
      armRGroup.position.set(0.7, 1.1, 0);
      const armR = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), matShirt);
      armR.position.y = -0.5;
      armRGroup.add(armR);
      humanMesh.add(armRGroup);

      // Perna Esquerda (Pivô no quadril y=0)
      const legLGroup = new THREE.Group();
      legLGroup.position.set(-0.25, 0, 0);
      const legL = new THREE.Mesh(new THREE.BoxGeometry(0.45, 1.2, 0.45), matSkin);
      legL.position.y = -0.6;
      legLGroup.add(legL);
      humanMesh.add(legLGroup);

      // Perna Direita
      const legRGroup = new THREE.Group();
      legRGroup.position.set(0.25, 0, 0);
      const legR = new THREE.Mesh(new THREE.BoxGeometry(0.45, 1.2, 0.45), matSkin);
      legR.position.y = -0.6;
      legRGroup.add(legR);
      humanMesh.add(legRGroup);

      group.add(humanMesh);
      group.humanMesh = humanMesh;
      group.armL = armLGroup;
      group.armR = armRGroup;
      group.legL = legLGroup;
      group.legR = legRGroup;
      group.head = head;
      group.materials = [matSkin, matShirt];

      return group;
    }

    // --- MODELO COMPLETO E DETALHADO DO DRAGÃO 3D (ZOAN REAL) ---
    function createDragonModel() {
      const dragon = new THREE.Group();
      const matSkin = new THREE.MeshStandardMaterial({ color: 0x440088, roughness: 0.3, metalness: 0.2 });
      const matBelly = new THREE.MeshStandardMaterial({ color: 0xaa00ff, roughness: 0.4 });
      const matHorn = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.2 });
      const matEye = new THREE.MeshBasicMaterial({ color: 0xff0033 });

      // Corpo Serpentino
      const bodyGroup = new THREE.Group();
      for(let i = 0; i < 7; i++) {
        const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.9 - i*0.07, 1.0 - i*0.07, 1.2, 8), matSkin);
        seg.position.set(0, 0.8, -i * 1.0);
        seg.rotation.x = Math.PI / 2;
        bodyGroup.add(seg);
      }
      dragon.add(bodyGroup);

      // Cabeça de Dragão
      const headGroup = new THREE.Group();
      headGroup.position.set(0, 1.2, 0.8);

      const headBase = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.9, 1.4), matSkin);
      headGroup.add(headBase);

      const snout = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.6, 1.2), matBelly);
      snout.position.set(0, -0.15, 0.8);
      headGroup.add(snout);

      // Chifres
      const hornL = new THREE.Mesh(new THREE.ConeGeometry(0.2, 1.4, 5), matHorn);
      hornL.rotation.x = -Math.PI / 4;
      hornL.rotation.z = -0.3;
      hornL.position.set(-0.4, 0.7, -0.3);
      headGroup.add(hornL);

      const hornR = hornL.clone();
      hornR.rotation.z = 0.3;
      hornR.position.set(0.4, 0.7, -0.3);
      headGroup.add(hornR);

      // Olhos Brilhantes
      const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), matEye);
      eyeL.position.set(-0.52, 0.2, 0.4);
      const eyeR = eyeL.clone();
      eyeR.position.x = 0.52;
      headGroup.add(eyeL);
      headGroup.add(eyeR);

      dragon.add(headGroup);

      // Asas do Dragão
      const wingL = new THREE.Group();
      wingL.position.set(-0.8, 1.2, -1.0);
      const wingMeshL = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.1, 1.6), matSkin);
      wingMeshL.position.x = -1.6;
      wingMeshL.rotation.z = 0.2;
      wingL.add(wingMeshL);
      dragon.add(wingL);

      const wingR = new THREE.Group();
      wingR.position.set(0.8, 1.2, -1.0);
      const wingMeshR = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.1, 1.6), matSkin);
      wingMeshR.position.x = 1.6;
      wingMeshR.rotation.z = -0.2;
      wingR.add(wingMeshR);
      dragon.add(wingR);

      dragon.wingL = wingL;
      dragon.wingR = wingR;
      dragon.head = headGroup;

      dragon.scale.set(1.5, 1.5, 1.5);
      dragon.position.y = -0.5;
      dragon.visible = false;
      return dragon;
    }

    // --- MUNDO ---
    const ocean = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshStandardMaterial({ color: 0x004488 }));
    ocean.rotation.x = -Math.PI / 2;
    ocean.position.y = 0;
    scene.add(ocean);

    const island = new THREE.Mesh(new THREE.CylinderGeometry(40, 45, 4, 32), new THREE.MeshStandardMaterial({ color: 0x22aa33 }));
    island.position.y = 2; // O topo da ilha fica exatamente em Y = 4.0
    scene.add(island);

    // NPCS
    const npcQuest = createRobloxCharacter(0xffcc99, 0x0055ff);
    npcQuest.position.set(-6, GROUND_Y, -8);
    scene.add(npcQuest);

    const npcGacha = createRobloxCharacter(0xffcc99, 0x9900ff);
    npcGacha.position.set(6, GROUND_Y, -8);
    scene.add(npcGacha);

    // --- JOGADOR ---
    const player = createRobloxCharacter(0xffcc99, 0xff2200);
    player.position.set(0, GROUND_Y, 10);
    scene.add(player);

    // Anexa a forma de Dragão ao jogador
    const dragonMesh = createDragonModel();
    player.add(dragonMesh);
    player.dragonMesh = dragonMesh;

    const playerData = {
      level: 1, xp: 0, maxXp: 100,
      hp: 100, maxHp: 100, beli: 1000,
      questActive: false, questKills: 0,
      currentFruit: 'dragon',
      isTransformed: false,
      vy: 0, isGrounded: true,
      speed: 0.24, isAttacking: false
    };

    // INIMIGOS
    const enemies = [];
    function spawnEnemy(x, z) {
      const enemy = createRobloxCharacter(0xffcc99, 0x333333);
      enemy.position.set(x, GROUND_Y, z);
      enemy.hp = 80; enemy.maxHp = 80;
      enemy.spawnPos = { x, z };
      scene.add(enemy);
      enemies.push(enemy);
    }
    spawnEnemy(12, 5);
    spawnEnemy(-12, 0);
    spawnEnemy(15, -10);

    // CONTROLES
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if(e.code === 'KeyZ') castSkill('z');
      if(e.code === 'KeyX') castSkill('x');
      if(e.code === 'KeyC') castSkill('c');
      if(e.code === 'KeyV') toggleTransformation();
      if(e.code === 'KeyE') interactNPCs();
      if(e.code === 'Space' && playerData.isGrounded) {
        playerData.vy = 0.38;
        playerData.isGrounded = false;
      }
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    function getPlayerForward() {
      const dir = new THREE.Vector3(0, 0, -1);
      dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);
      return dir;
    }

    // --- TRANSFORMAÇÃO ---
    function toggleTransformation() {
      const fruit = FRUITS[playerData.currentFruit];
      if(!fruit.hasTransformation) {
        showCenterMsg("Esta fruta não possui transformação!");
        return;
      }

      playerData.isTransformed = !playerData.isTransformed;

      if(playerData.currentFruit === 'dragon') {
        if(playerData.isTransformed) {
          player.humanMesh.visible = false;
          player.dragonMesh.visible = true;
          playSound('dragon');
          showCenterMsg("FORMA DRAGÃO ANCESTRAL DESTRUIDOR!");
        } else {
          player.humanMesh.visible = true;
          player.dragonMesh.visible = false;
          showCenterMsg("FORMA HUMANA");
        }
      } else if(playerData.currentFruit === 'buddha') {
        if(playerData.isTransformed) {
          player.humanMesh.scale.set(3.2, 3.2, 3.2);
          player.materials.forEach(m => { m.color.setHex(0xffd700); m.emissive.setHex(0x665500); });
          playSound('buddha');
          showCenterMsg("BUDA GIGANTE DE OURO!");
        } else {
          player.humanMesh.scale.set(1, 1, 1);
          player.materials[0].color.setHex(0xffcc99); player.materials[0].emissive.setHex(0x000000);
          player.materials[1].color.setHex(0xff2200); player.materials[1].emissive.setHex(0x000000);
          showCenterMsg("FORMA HUMANA");
        }
      }
    }

    // --- SISTEMA DE SKILLS VISUAIS REFEITAS ---
    function castSkill(slot) {
      if(playerData.isAttacking) return;
      playerData.isAttacking = true;

      const fruit = playerData.currentFruit;
      const mult = playerData.isTransformed ? 2.2 : 1.0;
      const fwd = getPlayerForward();

      if(fruit === 'dragon') {
        if(slot==='z') dragonZ(fwd, mult);
        if(slot==='x') dragonX(fwd, mult);
        if(slot==='c') dragonC(fwd, mult);
      } else if(fruit === 'buddha') {
        if(slot==='z') buddhaZ(fwd, mult);
        if(slot==='x') buddhaX(fwd, mult);
        if(slot==='c') buddhaC(fwd, mult);
      } else if(fruit === 'flame') {
        if(slot==='z') flameZ(fwd);
        if(slot==='x') flameX(fwd);
        if(slot==='c') flameC(fwd);
      } else if(fruit === 'ice') {
        if(slot==='z') iceZ(fwd);
        if(slot==='x') iceX(fwd);
        if(slot==='c') iceC(fwd);
      }
    }

    // 1. DRAGÃO
    function dragonZ(fwd, mult) {
      playSound('dragon');
      const clawGroup = new THREE.Group();
      for(let i = -1; i <= 1; i++) {
        const claw = new THREE.Mesh(new THREE.ConeGeometry(0.4 * mult, 3 * mult, 4), new THREE.MeshBasicMaterial({ color: 0xaa00ff }));
        claw.rotation.x = -Math.PI / 2;
        claw.position.x = i * 0.8 * mult;
        clawGroup.add(claw);
      }
      const pos = player.position.clone().add(fwd.clone().multiplyScalar(3 * mult));
      clawGroup.position.copy(pos);
      clawGroup.quaternion.copy(player.quaternion);
      scene.add(clawGroup);

      applyDamage(pos, 5 * mult, 60 * mult);
      setTimeout(() => { scene.remove(clawGroup); playerData.isAttacking = false; }, 300);
    }

    function dragonX(fwd, mult) {
      playSound('dragon');
      const breath = new THREE.Mesh(new THREE.ConeGeometry(2 * mult, 9 * mult, 12), new THREE.MeshBasicMaterial({ color: 0xff0066, transparent: true, opacity: 0.85 }));
      breath.rotation.x = -Math.PI / 2;
      const pos = player.position.clone().add(fwd.clone().multiplyScalar(5 * mult));
      breath.position.copy(pos);
      breath.quaternion.copy(player.quaternion);
      scene.add(breath);

      applyDamage(pos, 7 * mult, 90 * mult);
      setTimeout(() => { scene.remove(breath); playerData.isAttacking = false; }, 500);
    }

    function dragonC(fwd, mult) {
      playSound('dragon');
      const roar = new THREE.Mesh(new THREE.SphereGeometry(7 * mult, 16, 16), new THREE.MeshBasicMaterial({ color: 0x8800ff, transparent: true, opacity: 0.6 }));
      roar.position.copy(player.position);
      scene.add(roar);

      applyDamage(player.position, 12 * mult, 140 * mult);
      setTimeout(() => { scene.remove(roar); playerData.isAttacking = false; }, 600);
    }

    // 2. BUDDHA
    function buddhaZ(fwd, mult) {
      playSound('buddha');
      const palm = new THREE.Mesh(new THREE.BoxGeometry(4 * mult, 1.5, 4 * mult), new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xaa8800 }));
      const pos = player.position.clone().add(fwd.clone().multiplyScalar(4 * mult));
      palm.position.copy(pos);
      scene.add(palm);

      applyDamage(pos, 6 * mult, 55 * mult);
      setTimeout(() => { scene.remove(palm); playerData.isAttacking = false; }, 350);
    }

    function buddhaX(fwd, mult) {
      playSound('buddha');
      const ring = new THREE.Mesh(new THREE.RingGeometry(1, 6 * mult, 24), new THREE.MeshBasicMaterial({ color: 0xffaa00, side: THREE.DoubleSide }));
      ring.rotation.x = -Math.PI / 2;
      ring.position.set(player.position.x, 4.1, player.position.z);
      scene.add(ring);

      applyDamage(player.position, 9 * mult, 80 * mult);
      setTimeout(() => { scene.remove(ring); playerData.isAttacking = false; }, 450);
    }

    function buddhaC(fwd, mult) {
      playSound('buddha');
      const pillar = new THREE.Mesh(new THREE.CylinderGeometry(6 * mult, 6 * mult, 35, 16), new THREE.MeshBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.8 }));
      pillar.position.set(player.position.x, 18, player.position.z);
      scene.add(pillar);

      applyDamage(player.position, 12 * mult, 130 * mult);
      setTimeout(() => { scene.remove(pillar); playerData.isAttacking = false; }, 650);
    }

    // 3. FLAME
    function flameZ(fwd) {
      playSound('fire');
      const fireball = new THREE.Mesh(new THREE.SphereGeometry(1.5, 12, 12), new THREE.MeshBasicMaterial({ color: 0xff4500 }));
      const pos = player.position.clone().add(fwd.clone().multiplyScalar(2));
      fireball.position.copy(pos);
      scene.add(fireball);

      let dist = 0;
      const interval = setInterval(() => {
        fireball.position.add(fwd.clone().multiplyScalar(0.7));
        dist += 0.7;
        applyDamage(fireball.position, 3, 40);
        if(dist >= 15) {
          clearInterval(interval);
          scene.remove(fireball);
          playerData.isAttacking = false;
        }
      }, 20);
    }

    function flameX(fwd) {
      playSound('fire');
      const eruption = new THREE.Mesh(new THREE.ConeGeometry(3, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff2200 }));
      const pos = player.position.clone().add(fwd.clone().multiplyScalar(5));
      eruption.position.set(pos.x, 8, pos.z);
      scene.add(eruption);

      applyDamage(pos, 6, 75);
      setTimeout(() => { scene.remove(eruption); playerData.isAttacking = false; }, 450);
    }

    function flameC(fwd) {
      playSound('fire');
      const meteor = new THREE.Mesh(new THREE.SphereGeometry(3, 16, 16), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
      const targetPos = player.position.clone().add(fwd.clone().multiplyScalar(8));
      meteor.position.set(targetPos.x, targetPos.y + 20, targetPos.z);
      scene.add(meteor);

      const interval = setInterval(() => {
        meteor.position.y -= 1.0;
        if(meteor.position.y <= 4) {
          clearInterval(interval);
          scene.remove(meteor);
          playSound('hit');
          applyDamage(targetPos, 9, 110);
          playerData.isAttacking = false;
        }
      }, 20);
    }

    // 4. ICE
    function iceZ(fwd) {
      playSound('ice');
      const spear = new THREE.Mesh(new THREE.ConeGeometry(0.5, 4, 6), new THREE.MeshBasicMaterial({ color: 0x00ffff }));
      spear.rotation.x = -Math.PI / 2;
      const pos = player.position.clone().add(fwd.clone().multiplyScalar(2));
      spear.position.copy(pos);
      spear.quaternion.copy(player.quaternion);
      scene.add(spear);

      let dist = 0;
      const interval = setInterval(() => {
        spear.position.add(fwd.clone().multiplyScalar(0.8));
        dist += 0.8;
        applyDamage(spear.position, 2.5, 45);
        if(dist >= 16) {
          clearInterval(interval);
          scene.remove(spear);
          playerData.isAttacking = false;
        }
      }, 20);
    }

    function iceX(fwd) {
      playSound('ice');
      const iceGroup = new THREE.Group();
      for(let i=0; i<8; i++) {
        const spike = new THREE.Mesh(new THREE.ConeGeometry(0.7, 5, 5), new THREE.MeshBasicMaterial({ color: 0x88ffff }));
        const angle = (i / 8) * Math.PI * 2;
        spike.position.set(Math.cos(angle)*4, 2, Math.sin(angle)*4);
        iceGroup.add(spike);
      }
      iceGroup.position.copy(player.position);
      scene.add(iceGroup);

      applyDamage(player.position, 7, 70);
      setTimeout(() => { scene.remove(iceGroup); playerData.isAttacking = false; }, 500);
    }

    function iceC(fwd) {
      playSound('ice');
      const iceAge = new THREE.Mesh(new THREE.CylinderGeometry(11, 11, 0.5, 24), new THREE.MeshBasicMaterial({ color: 0x00d9ff, transparent: true, opacity: 0.85 }));
      iceAge.position.set(player.position.x, 4.1, player.position.z);
      scene.add(iceAge);

      applyDamage(player.position, 11, 120);
      setTimeout(() => { scene.remove(iceAge); playerData.isAttacking = false; }, 700);
    }

    function applyDamage(pos, radius, damage) {
      enemies.forEach(e => {
        if(e.position.distanceTo(pos) <= radius) {
          e.hp -= damage;
          if(e.hp <= 0) {
            e.position.set(e.spawnPos.x, GROUND_Y, e.spawnPos.z);
            e.hp = e.maxHp;
            addXP(50);
            playerData.beli += 100;

            if(playerData.questActive) {
              playerData.questKills++;
              if(playerData.questKills >= 3) {
                playerData.questActive = false;
                addXP(150);
                playerData.beli += 400;
                showCenterMsg("MISSÃO CONCLUÍDA! +$400");
              }
              updateUI();
            }
          }
        }
      });
    }

    // --- ANIMAÇÃO DE MOVIMENTO E ASAS DO DRAGÃO ---
    const clock = new THREE.Clock();
    function animateCharacters() {
      const time = clock.getElapsedTime();
      let moveX = 0, moveZ = 0;

      if(keys['KeyW']) moveZ -= 1;
      if(keys['KeyS']) moveZ += 1;
      if(keys['KeyA']) moveX -= 1;
      if(keys['KeyD']) moveX += 1;

      const isMoving = moveX !== 0 || moveZ !== 0;

      // Rotaciona o jogador na direção do movimento
      if(isMoving) {
        const angle = Math.atan2(moveX, moveZ);
        player.rotation.y = angle;
        player.position.x += Math.sin(angle) * playerData.speed;
        player.position.z += Math.cos(angle) * playerData.speed;
      }

      // FÍSICA E PULO
      playerData.vy -= 0.018;
      player.position.y += playerData.vy;

      if(player.position.y <= GROUND_Y) {
        player.position.y = GROUND_Y;
        playerData.vy = 0;
        playerData.isGrounded = true;
      }

      // ANIMAÇÃO HUMANA
      if(player.humanMesh.visible) {
        if(!playerData.isGrounded) {
          player.armL.rotation.x = Math.PI;
          player.armR.rotation.x = Math.PI;
          player.legL.rotation.x = -0.5;
          player.legR.rotation.x = 0.5;
        } else if(isMoving) {
          const walkSpeed = 12;
          player.armL.rotation.x = Math.sin(time * walkSpeed) * 0.6;
          player.armR.rotation.x = -Math.sin(time * walkSpeed) * 0.6;
          player.legL.rotation.x = -Math.sin(time * walkSpeed) * 0.7;
          player.legR.rotation.x = Math.sin(time * walkSpeed) * 0.7;
        } else {
          player.armL.rotation.x = Math.sin(time * 2) * 0.05;
          player.armR.rotation.x = -Math.sin(time * 2) * 0.05;
          player.legL.rotation.x = 0;
          player.legR.rotation.x = 0;
        }
      }

      // ANIMAÇÃO DE BATER ASAS DO DRAGÃO
      if(player.dragonMesh.visible) {
        player.dragonMesh.wingL.rotation.z = Math.sin(time * 6) * 0.3;
        player.dragonMesh.wingR.rotation.z = -Math.sin(time * 6) * 0.3;
        player.dragonMesh.head.position.y = 1.2 + Math.sin(time * 3) * 0.1;
      }

      // ANIMAÇÃO DOS INIMIGOS
      enemies.forEach(enemy => {
        enemy.legL.rotation.x = Math.sin(time * 8) * 0.4;
        enemy.legR.rotation.x = -Math.sin(time * 8) * 0.4;
      });
    }

    // --- NPCS & INTERAÇÃO ---
    function interactNPCs() {
      if(player.position.distanceTo(npcQuest.position) < 4) {
        playerData.questActive = true;
        playerData.questKills = 0;
        showCenterMsg("MISSÃO ACEITA: Derrote 3 Bandidos");
        updateUI();
      }

      if(player.position.distanceTo(npcGacha.position) < 4) {
        if(playerData.beli < 500) {
          showCenterMsg("BELI INSUFICIENTE! ($500)");
          return;
        }

        playerData.beli -= 500;
        playSound('dragon');

        const fruitKeys = Object.keys(FRUITS);
        const randomFruitKey = fruitKeys[Math.floor(Math.random() * fruitKeys.length)];
        playerData.currentFruit = randomFruitKey;

        if(playerData.isTransformed) toggleTransformation();

        showCenterMsg(`NOVA FRUTA: ${FRUITS[randomFruitKey].name.toUpperCase()}!`);
        updateUI();
      }
    }

    function addXP(amount) {
      playerData.xp += amount;
      if(playerData.xp >= playerData.maxXp) {
        playerData.level++;
        playerData.xp = 0;
        playerData.maxXp = Math.floor(playerData.maxXp * 1.5);
        playerData.maxHp += 30;
        playerData.hp = playerData.maxHp;
        showCenterMsg("LEVEL UP! NV " + playerData.level);
      }
      updateUI();
    }

    function showCenterMsg(text) {
      const msg = document.getElementById('center-msg');
      msg.innerText = text;
      msg.style.opacity = 1;
      setTimeout(() => msg.style.opacity = 0, 2500);
    }

    function updateUI() {
      const fruit = FRUITS[playerData.currentFruit];
      document.getElementById('lbl-level').innerText = playerData.level;
      document.getElementById('lbl-fruit').innerText = fruit.name;
      document.getElementById('lbl-hp').innerText = `${Math.floor(playerData.hp)}/${playerData.maxHp}`;
      document.getElementById('lbl-beli').innerText = playerData.beli;
      
      document.getElementById('hp-bar').style.width = `${(playerData.hp / playerData.maxHp) * 100}%`;
      document.getElementById('xp-bar').style.width = `${(playerData.xp / playerData.maxXp) * 100}%`;

      document.getElementById('slot-z').innerText = fruit.skills.z;
      document.getElementById('slot-x').innerText = fruit.skills.x;
      document.getElementById('slot-c').innerText = fruit.skills.c;
      document.getElementById('slot-v').innerText = fruit.skills.v;

      const questDesc = document.getElementById('quest-desc');
      const questProg = document.getElementById('quest-prog');
      if(playerData.questActive) {
        questDesc.innerText = "Derrote os Bandidos na ilha.";
        questProg.innerText = `Progresso: ${playerData.questKills}/3 Bandidos`;
      } else {
        questDesc.innerText = "Fale com o NPC de Missões (Azul).";
        questProg.innerText = "Nenhuma missão ativa";
      }
    }

    // --- LOOP PRINCIPAL ---
    function animate() {
      requestAnimationFrame(animate);

      // Trava Limite da Ilha
      const dist = Math.hypot(player.position.x, player.position.z);
      if(dist > 38) { player.position.x *= 0.98; player.position.z *= 0.98; }

      animateCharacters();

      // Câmera
      camera.position.set(player.position.x, player.position.y + 8, player.position.z + 14);
      camera.lookAt(player.position.x, player.position.y + 1, player.position.z);

      // Inimigos Perseguem Jogador
      enemies.forEach(enemy => {
        const d = enemy.position.distanceTo(player.position);
        if(d < 12 && d > 2) {
          const dir = player.position.clone().sub(enemy.position).normalize();
          enemy.rotation.y = Math.atan2(dir.x, dir.z);
          enemy.position.x += dir.x * 0.05;
          enemy.position.z += dir.z * 0.05;
        } else if(d <= 2) {
          playerData.hp = Math.max(0, playerData.hp - 0.2);
          updateUI();
          if(playerData.hp === 0) {
            player.position.set(0, GROUND_Y, 10);
            playerData.hp = playerData.maxHp;
            showCenterMsg("VOCÊ MORREU!");
            updateUI();
          }
        }
      });

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    updateUI();
    animate();
  </script>
</body>
</html>
