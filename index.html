<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blox Fruits 3D - Animações, Buddha & Zoan</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; background: #000; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
    #ui {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
    }
    .status-bar {
      background: rgba(15, 15, 25, 0.85); backdrop-filter: blur(8px);
      border: 2px solid #00f3ff; border-radius: 12px; padding: 15px 25px;
      width: 360px; color: #fff;
    }
    .status-title { font-size: 16px; font-weight: 900; color: #00f3ff; margin-bottom: 8px; text-transform: uppercase; }
    .bar-container { background: #222; height: 14px; border-radius: 8px; overflow: hidden; margin-bottom: 6px; border: 1px solid #444; }
    .hp-bar { background: linear-gradient(90deg, #ff0055, #ff5500); width: 100%; height: 100%; transition: width 0.2s; }
    .xp-bar { background: linear-gradient(90deg, #00f3ff, #0055ff); width: 0%; height: 100%; transition: width 0.2s; }
    .info-text { font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; color: #ccc; }
    .quest-panel {
      position: absolute; top: 20px; right: 20px;
      background: rgba(15, 15, 25, 0.85); border: 2px solid #ffaa00;
      border-radius: 12px; padding: 15px; width: 260px; color: #fff;
    }
    .quest-title { color: #ffaa00; font-weight: 900; font-size: 16px; margin-bottom: 5px; }
    .hotbar-container {
      align-self: center; display: flex; gap: 10px; margin-bottom: 15px;
      background: rgba(10, 10, 20, 0.85); padding: 10px 18px; border-radius: 15px;
      border: 2px solid rgba(0, 243, 255, 0.3);
    }
    .hotbar-slot {
      background: rgba(20, 20, 35, 0.9); border: 2px solid #00f3ff;
      border-radius: 10px; padding: 8px; width: 100px; text-align: center; color: #fff;
    }
    .hotbar-slot.transform { border-color: #ff00ea; }
    .skill-key { font-size: 16px; font-weight: 900; color: #00f3ff; }
    .hotbar-slot.transform .skill-key { color: #ff00ea; }
    .skill-name { font-size: 10px; font-weight: bold; margin-top: 3px; text-transform: uppercase; color: #fff; }
    .controls-guide {
      position: absolute; bottom: 20px; left: 20px;
      background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px;
      color: #aaa; font-size: 12px; border: 1px solid #333;
    }
    #center-msg {
      position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%);
      font-size: 28px; font-weight: 900; color: #ffd700; text-shadow: 0 0 20px #ff0055;
      opacity: 0; transition: opacity 0.3s; text-transform: uppercase; text-align: center; pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="ui">
    <div class="status-bar">
      <div class="status-title">Nível <span id="lbl-level">1</span> | Fruta: <span id="lbl-fruit" style="color:#ffaa00">Buddha</span></div>
      <div class="bar-container"><div id="hp-bar" class="hp-bar"></div></div>
      <div class="bar-container"><div id="xp-bar" class="xp-bar"></div></div>
      <div class="info-text">
        <span>HP: <span id="lbl-hp">100/100</span></span>
        <span>Beli: $<span id="lbl-beli">1000</span></span>
      </div>
    </div>

    <div class="quest-panel">
      <div class="quest-title">📜 Missão Atual</div>
      <div id="quest-desc" style="font-size: 13px; color: #ddd;">Fale com o NPC Azul.</div>
      <div style="font-size: 12px; color: #ffaa00; margin-top: 8px;" id="quest-prog">Progresso: 0/3 Bandidos</div>
    </div>

    <div id="center-msg">MENSAGEM</div>

    <div class="hotbar-container">
      <div class="hotbar-slot"><div class="skill-key">Z</div><div class="skill-name" id="slot-z">Skill Z</div></div>
      <div class="hotbar-slot"><div class="skill-key">X</div><div class="skill-name" id="slot-x">Skill X</div></div>
      <div class="hotbar-slot"><div class="skill-key">C</div><div class="skill-name" id="slot-c">Skill C</div></div>
      <div class="hotbar-slot transform"><div class="skill-key">V</div><div class="skill-name" id="slot-v">Transformar</div></div>
    </div>

    <div class="controls-guide">
      <b>Movimento:</b> WASD | <b>Pulo:</b> Espaço | <b>Ataques:</b> Z, X, C | <b>Transformação:</b> V<br>
      <span style="color:#ff00ea">NPC Roxo: Giro ($500)</span> | <span style="color:#0055ff">NPC Azul: Missão</span>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // --- ÁUDIO SINTETIZADO ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    function playSound(type) {
      if(!audioCtx) audioCtx = new AudioCtx();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if(type==='hit') {
        osc.type = 'square'; osc.frequency.setValueAtTime(120, now);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now+0.1);
        osc.start(now); osc.stop(now+0.1);
      } else if(type==='buddha') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(80, now);
        osc.frequency.exponentialRampToValueAtTime(250, now+0.5);
        gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0.01, now+0.5);
        osc.start(now); osc.stop(now+0.5);
      } else if(type==='dragon') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(60, now+0.6);
        gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0.01, now+0.6);
        osc.start(now); osc.stop(now+0.6);
      }
    }

    // --- DEFINIÇÃO DAS FRUTAS ---
    const FRUITS = {
      buddha: {
        name: "Buddha (Rework)", color: 0xffd700,
        hasTransformation: true,
        skills: { z: "Impacto Dourado", x: "Retribuição de Karma", c: "Explosão Divina", v: "Forma Buda" }
      },
      dragon: {
        name: "Dragão (Zoan)", color: 0xaa00ff,
        hasTransformation: true,
        skills: { z: "Garra de Dragão", x: "Sopro de Fogo", c: "Rugido do Céu", v: "Forma Besta" }
      },
      flame: {
        name: "Chama", color: 0xff4500,
        hasTransformation: false,
        skills: { z: "Punho de Fogo", x: "Sopro Vulcânico", c: "Meteoro Solar", v: "Indisponível" }
      },
      ice: {
        name: "Gelo", color: 0x00ffff,
        hasTransformation: false,
        skills: { z: "Lança Congelante", x: "Prisão Glacial", c: "Era do Gelo", v: "Indisponível" }
      }
    };

    // --- CENA E RENDERIZADOR ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x40a0ff);
    scene.fog = new THREE.FogExp2(0x40a0ff, 0.01);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(50, 80, 50);
    scene.add(dirLight);

    // --- MODELO ARTICULADO DO PERSONAGEM ---
    function createRobloxCharacter(colorSkin, colorShirt) {
      const group = new THREE.Group();
      const matSkin = new THREE.MeshStandardMaterial({ color: colorSkin, roughness: 0.5 });
      const matShirt = new THREE.MeshStandardMaterial({ color: colorShirt, roughness: 0.5 });

      // Cabeça
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), matSkin);
      head.position.y = 1.4;
      group.add(head);

      // Torso
      const torso = new THREE.Mesh(new THREE.BoxGeometry(1, 1.2, 0.5), matShirt);
      torso.position.y = 0.4;
      group.add(torso);

      // Braço Esquerdo
      const armLGroup = new THREE.Group();
      armLGroup.position.set(-0.7, 0.8, 0);
      const armL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), matShirt);
      armL.position.y = -0.4;
      armLGroup.add(armL);
      group.add(armLGroup);

      // Braço Direito
      const armRGroup = new THREE.Group();
      armRGroup.position.set(0.7, 0.8, 0);
      const armR = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), matShirt);
      armR.position.y = -0.4;
      armRGroup.add(armR);
      group.add(armRGroup);

      // Perna Esquerda
      const legLGroup = new THREE.Group();
      legLGroup.position.set(-0.25, -0.2, 0);
      const legL = new THREE.Mesh(new THREE.BoxGeometry(0.45, 1.2, 0.45), matSkin);
      legL.position.y = -0.6;
      legLGroup.add(legL);
      group.add(legLGroup);

      // Perna Direita
      const legRGroup = new THREE.Group();
      legRGroup.position.set(0.25, -0.2, 0);
      const legR = new THREE.Mesh(new THREE.BoxGeometry(0.45, 1.2, 0.45), matSkin);
      legR.position.y = -0.6;
      legRGroup.add(legR);
      group.add(legRGroup);

      group.armL = armLGroup;
      group.armR = armRGroup;
      group.legL = legLGroup;
      group.legR = legRGroup;
      group.head = head;
      group.torso = torso;
      group.materials = [matSkin, matShirt];
      return group;
    }

    // --- MUNDO ---
    const ocean = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshStandardMaterial({ color: 0x004488 }));
    ocean.rotation.x = -Math.PI / 2;
    ocean.position.y = 0;
    scene.add(ocean);

    const island = new THREE.Mesh(new THREE.CylinderGeometry(40, 45, 4, 32), new THREE.MeshStandardMaterial({ color: 0x22aa33 }));
    island.position.y = 2;
    scene.add(island);

    // NPCS
    const npcQuest = createRobloxCharacter(0xffcc99, 0x0055ff);
    npcQuest.position.set(-6, 4, -8);
    scene.add(npcQuest);

    const npcGacha = createRobloxCharacter(0xffcc99, 0x9900ff);
    npcGacha.position.set(6, 4, -8);
    scene.add(npcGacha);

    // --- JOGADOR ---
    const player = createRobloxCharacter(0xffcc99, 0xff2200);
    player.position.set(0, 4, 10);
    scene.add(player);

    const playerData = {
      level: 1, xp: 0, maxXp: 100,
      hp: 100, maxHp: 100, beli: 1000,
      questActive: false, questKills: 0,
      currentFruit: 'buddha',
      isTransformed: false,
      vy: 0, isGrounded: true,
      speed: 0.22, isAttacking: false
    };

    // INIMIGOS
    const enemies = [];
    function spawnEnemy(x, z) {
      const enemy = createRobloxCharacter(0xffcc99, 0x333333);
      enemy.position.set(x, 4, z);
      enemy.hp = 80; enemy.maxHp = 80;
      enemy.spawnPos = { x, z };
      scene.add(enemy);
      enemies.push(enemy);
    }
    spawnEnemy(12, 5);
    spawnEnemy(-12, 0);
    spawnEnemy(15, -10);

    // CONTROLES
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if(e.code === 'KeyZ') castSkill('z');
      if(e.code === 'KeyX') castSkill('x');
      if(e.code === 'KeyC') castSkill('c');
      if(e.code === 'KeyV') toggleTransformation();
      if(e.code === 'KeyE') interactNPCs();
      if(e.code === 'Space' && playerData.isGrounded) {
        playerData.vy = 0.35;
        playerData.isGrounded = false;
      }
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    // --- SISTEMA DE TRANSFORMAÇÃO (BUDDHA E ZOAN) ---
    function toggleTransformation() {
      const fruit = FRUITS[playerData.currentFruit];
      if(!fruit.hasTransformation) {
        showCenterMsg("Esta fruta não possui transformação!");
        return;
      }

      playerData.isTransformed = !playerData.isTransformed;

      if(playerData.currentFruit === 'buddha') {
        if(playerData.isTransformed) {
          player.scale.set(3, 3, 3);
          player.materials.forEach(m => m.color.setHex(0xffd700));
          playSound('buddha');
          showCenterMsg("FORMA BUDA ATIVADA! (+DANO / +RAIO)");
        } else {
          player.scale.set(1, 1, 1);
          player.materials[0].color.setHex(0xffcc99);
          player.materials[1].color.setHex(0xff2200);
          showCenterMsg("FORMA NORMAL");
        }
      } else if(playerData.currentFruit === 'dragon') {
        if(playerData.isTransformed) {
          player.scale.set(2, 2, 2);
          player.materials.forEach(m => m.color.setHex(0xaa00ff));
          playSound('dragon');
          showCenterMsg("FORMA BESTA DO DRAGÃO ATIVADA!");
        } else {
          player.scale.set(1, 1, 1);
          player.materials[0].color.setHex(0xffcc99);
          player.materials[1].color.setHex(0xff2200);
          showCenterMsg("FORMA NORMAL");
        }
      }
    }

    // --- HABILIDADES DAS FRUTAS ---
    function castSkill(slot) {
      if(playerData.isAttacking) return;
      playerData.isAttacking = true;

      const fruit = playerData.currentFruit;
      const scaleMultiplier = playerData.isTransformed ? 2 : 1;

      if(fruit === 'buddha') {
        if(slot==='z') buddhaZ(scaleMultiplier);
        if(slot==='x') buddhaX(scaleMultiplier);
        if(slot==='c') buddhaC(scaleMultiplier);
      } else if(fruit === 'dragon') {
        if(slot==='z') dragonZ(scaleMultiplier);
        if(slot==='x') dragonX(scaleMultiplier);
        if(slot==='c') dragonC(scaleMultiplier);
      } else {
        // Habilidades básicas de outras frutas
        playSound('hit');
        applyDamage(player.position, 6 * scaleMultiplier, 40);
        setTimeout(() => playerData.isAttacking = false, 300);
      }
    }

    // SKILLS REWORK BUDDHA
    function buddhaZ(mult) {
      playSound('buddha');
      player.armR.rotation.x = -Math.PI / 2;
      const palm = new THREE.Mesh(new THREE.BoxGeometry(3 * mult, 1, 3 * mult), new THREE.MeshBasicMaterial({ color: 0xffd700 }));
      palm.position.set(player.position.x, player.position.y + 1, player.position.z - (3 * mult));
      scene.add(palm);

      applyDamage(palm.position, 6 * mult, 45 * mult);

      setTimeout(() => {
        scene.remove(palm);
        player.armR.rotation.x = 0;
        playerData.isAttacking = false;
      }, 300);
    }

    function buddhaX(mult) {
      playSound('buddha');
      const wave = new THREE.Mesh(new THREE.RingGeometry(1, 4 * mult, 16), new THREE.MeshBasicMaterial({ color: 0xffa500, side: THREE.DoubleSide }));
      wave.rotation.x = -Math.PI / 2;
      wave.position.set(player.position.x, 2.1, player.position.z);
      scene.add(wave);

      applyDamage(player.position, 8 * mult, 70 * mult);

      setTimeout(() => {
        scene.remove(wave);
        playerData.isAttacking = false;
      }, 400);
    }

    function buddhaC(mult) {
      playSound('buddha');
      const pillar = new THREE.Mesh(new THREE.CylinderGeometry(5 * mult, 5 * mult, 30, 16), new THREE.MeshBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.8 }));
      pillar.position.set(player.position.x, 15, player.position.z);
      scene.add(pillar);

      applyDamage(player.position, 12 * mult, 120 * mult);

      setTimeout(() => {
        scene.remove(pillar);
        playerData.isAttacking = false;
      }, 600);
    }

    // SKILLS ZOAN DRAGÃO
    function dragonZ(mult) {
      playSound('dragon');
      const claw = new THREE.Mesh(new THREE.ConeGeometry(1 * mult, 4 * mult, 4), new THREE.MeshBasicMaterial({ color: 0xaa00ff }));
      claw.rotation.x = -Math.PI / 2;
      claw.position.set(player.position.x, player.position.y + 1, player.position.z - (2 * mult));
      scene.add(claw);

      applyDamage(claw.position, 5 * mult, 50 * mult);

      setTimeout(() => {
        scene.remove(claw);
        playerData.isAttacking = false;
      }, 250);
    }

    function dragonX(mult) {
      playSound('dragon');
      const breath = new THREE.Mesh(new THREE.ConeGeometry(2 * mult, 8 * mult, 8), new THREE.MeshBasicMaterial({ color: 0xff0055 }));
      breath.rotation.x = -Math.PI / 2;
      breath.position.set(player.position.x, player.position.y + 1, player.position.z - (4 * mult));
      scene.add(breath);

      applyDamage(player.position.clone().add(new THREE.Vector3(0,0,-4)), 7 * mult, 80 * mult);

      setTimeout(() => {
        scene.remove(breath);
        playerData.isAttacking = false;
      }, 450);
    }

    function dragonC(mult) {
      playSound('dragon');
      const roar = new THREE.Mesh(new THREE.SphereGeometry(6 * mult, 16, 16), new THREE.MeshBasicMaterial({ color: 0x8800ff, transparent: true, opacity: 0.6 }));
      roar.position.copy(player.position);
      scene.add(roar);

      applyDamage(player.position, 10 * mult, 130 * mult);

      setTimeout(() => {
        scene.remove(roar);
        playerData.isAttacking = false;
      }, 500);
    }

    function applyDamage(pos, radius, damage) {
      enemies.forEach(e => {
        if(e.position.distanceTo(pos) <= radius) {
          e.hp -= damage;
          if(e.hp <= 0) {
            e.position.set(e.spawnPos.x, 4, e.spawnPos.z);
            e.hp = e.maxHp;
            addXP(50);
            playerData.beli += 100;

            if(playerData.questActive) {
              playerData.questKills++;
              if(playerData.questKills >= 3) {
                playerData.questActive = false;
                addXP(150);
                playerData.beli += 400;
                showCenterMsg("MISSÃO CONCLUÍDA! +$400");
              }
              updateUI();
            }
          }
        }
      });
    }

    // --- ANIMAÇÃO DE MOVIMENTO (IDLE, WALK, JUMP) ---
    const clock = new THREE.Clock();
    function animateCharacters() {
      const time = clock.getElapsedTime();
      const isMoving = keys['KeyW'] || keys['KeyS'] || keys['KeyA'] || keys['KeyD'];

      // PULO E FÍSICA
      playerData.vy -= 0.018; // Gravidade
      player.position.y += playerData.vy;

      if(player.position.y <= 4) {
        player.position.y = 4;
        playerData.vy = 0;
        playerData.isGrounded = true;
      }

      // ANIMAÇÃO DO JOGADOR
      if(!playerData.isGrounded) {
        // Animação de Pulo
        player.armL.rotation.x = Math.PI;
        player.armR.rotation.x = Math.PI;
        player.legL.rotation.x = -0.5;
        player.legR.rotation.x = 0.5;
      } else if(isMoving && !playerData.isAttacking) {
        // Animação de Andar
        const walkSpeed = 12;
        player.armL.rotation.x = Math.sin(time * walkSpeed) * 0.6;
        player.armR.rotation.x = -Math.sin(time * walkSpeed) * 0.6;
        player.legL.rotation.x = -Math.sin(time * walkSpeed) * 0.7;
        player.legR.rotation.x = Math.sin(time * walkSpeed) * 0.7;
      } else if(!playerData.isAttacking) {
        // Animação Idle (Respirando)
        player.armL.rotation.x = Math.sin(time * 2) * 0.05;
        player.armR.rotation.x = -Math.sin(time * 2) * 0.05;
        player.legL.rotation.x = 0;
        player.legR.rotation.x = 0;
        player.head.position.y = 1.4 + Math.sin(time * 3) * 0.03;
      }

      // ANIMAÇÃO DOS INIMIGOS
      enemies.forEach(enemy => {
        enemy.legL.rotation.x = Math.sin(time * 8) * 0.4;
        enemy.legR.rotation.x = -Math.sin(time * 8) * 0.4;
      });
    }

    // --- NPCS E INTERAÇÃO ---
    function interactNPCs() {
      if(player.position.distanceTo(npcQuest.position) < 4) {
        playerData.questActive = true;
        playerData.questKills = 0;
        showCenterMsg("MISSÃO ACEITA: Derrote 3 Bandidos");
        updateUI();
      }

      if(player.position.distanceTo(npcGacha.position) < 4) {
        if(playerData.beli < 500) {
          showCenterMsg("BELI INSUFICIENTE! ($500)");
          return;
        }

        playerData.beli -= 500;
        playSound('buddha');

        const fruitKeys = Object.keys(FRUITS);
        const randomFruitKey = fruitKeys[Math.floor(Math.random() * fruitKeys.length)];
        playerData.currentFruit = randomFruitKey;

        // Reseta transformação
        if(playerData.isTransformed) toggleTransformation();

        showCenterMsg(`NOVA FRUTA: ${FRUITS[randomFruitKey].name.toUpperCase()}!`);
        updateUI();
      }
    }

    function addXP(amount) {
      playerData.xp += amount;
      if(playerData.xp >= playerData.maxXp) {
        playerData.level++;
        playerData.xp = 0;
        playerData.maxXp = Math.floor(playerData.maxXp * 1.5);
        playerData.maxHp += 30;
        playerData.hp = playerData.maxHp;
        showCenterMsg("LEVEL UP! NV " + playerData.level);
      }
      updateUI();
    }

    function showCenterMsg(text) {
      const msg = document.getElementById('center-msg');
      msg.innerText = text;
      msg.style.opacity = 1;
      setTimeout(() => msg.style.opacity = 0, 2500);
    }

    function updateUI() {
      const fruit = FRUITS[playerData.currentFruit];
      document.getElementById('lbl-level').innerText = playerData.level;
      document.getElementById('lbl-fruit').innerText = fruit.name;
      document.getElementById('lbl-hp').innerText = `${Math.floor(playerData.hp)}/${playerData.maxHp}`;
      document.getElementById('lbl-beli').innerText = playerData.beli;
      
      document.getElementById('hp-bar').style.width = `${(playerData.hp / playerData.maxHp) * 100}%`;
      document.getElementById('xp-bar').style.width = `${(playerData.xp / playerData.maxXp) * 100}%`;

      document.getElementById('slot-z').innerText = fruit.skills.z;
      document.getElementById('slot-x').innerText = fruit.skills.x;
      document.getElementById('slot-c').innerText = fruit.skills.c;
      document.getElementById('slot-v').innerText = fruit.skills.v;

      const questDesc = document.getElementById('quest-desc');
      const questProg = document.getElementById('quest-prog');
      if(playerData.questActive) {
        questDesc.innerText = "Derrote os Bandidos na ilha.";
        questProg.innerText = `Progresso: ${playerData.questKills}/3 Bandidos`;
      } else {
        questDesc.innerText = "Fale com o NPC de Missões (Azul).";
        questProg.innerText = "Nenhuma missão ativa";
      }
    }

    // --- LOOP DE RENDERIZAÇÃO ---
    function animate() {
      requestAnimationFrame(animate);

      // Movimento do Jogador
      if(keys['KeyW']) player.position.z -= playerData.speed;
      if(keys['KeyS']) player.position.z += playerData.speed;
      if(keys['KeyA']) player.position.x -= playerData.speed;
      if(keys['KeyD']) player.position.x += playerData.speed;

      // Limite da Ilha
      const dist = Math.hypot(player.position.x, player.position.z);
      if(dist > 38) { player.position.x *= 0.98; player.position.z *= 0.98; }

      // Atualiza Animações de Membros e Pulo
      animateCharacters();

      // Câmera
      camera.position.set(player.position.x, player.position.y + 8, player.position.z + 14);
      camera.lookAt(player.position.x, player.position.y + 1, player.position.z);

      // Perseguição dos Inimigos
      enemies.forEach(enemy => {
        const d = enemy.position.distanceTo(player.position);
        if(d < 12 && d > 2) {
          const dir = player.position.clone().sub(enemy.position).normalize();
          enemy.position.x += dir.x * 0.05;
          enemy.position.z += dir.z * 0.05;
        } else if(d <= 2) {
          playerData.hp = Math.max(0, playerData.hp - 0.2);
          updateUI();
          if(playerData.hp === 0) {
            player.position.set(0, 4, 10);
            playerData.hp = playerData.maxHp;
            showCenterMsg("VOCÊ MORREU!");
            updateUI();
          }
        }
      });

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    updateUI();
    animate();
  </script>
</body>
</html>
