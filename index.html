<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit World 3D</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #101827;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

#canvas-container {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(#263b5c, #101827);
}

#canvas-container canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
}

#ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
}

.panel {
    background: rgba(8, 12, 24, 0.92);
    border: 2px solid #263d68;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,.45);
    backdrop-filter: blur(8px);
}

#stats {
    position: absolute;
    left: 18px;
    top: 18px;
    width: 330px;
    padding: 15px;
}

.title {
    color: #00eaff;
    font-size: 17px;
    font-weight: 900;
    margin-bottom: 10px;
}

.bar {
    height: 15px;
    background: #20283a;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #39455d;
    margin-top: 6px;
}

#hp-fill {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg,#ff1744,#ff6d00);
}

#xp-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg,#00eaff,#2979ff);
}

.info {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    color: #d0d6e2;
    font-size: 13px;
}

#fruit-info {
    margin-top: 10px;
    color: #fff;
    font-weight: bold;
}

#quest {
    position: absolute;
    right: 18px;
    top: 18px;
    width: 300px;
    padding: 15px;
    border-color: #ffb300;
}

#quest h3 {
    color: #ffb300;
    margin-bottom: 8px;
}

#quest-text {
    font-size: 13px;
    color: #ddd;
    line-height: 1.5;
}

#npc-message {
    position: absolute;
    left: 50%;
    top: 27%;
    transform: translate(-50%,-50%);
    padding: 15px 25px;
    background: rgba(0,0,0,.8);
    border: 2px solid #00eaff;
    border-radius: 14px;
    color: #fff;
    font-weight: bold;
    font-size: 18px;
    text-align: center;
    opacity: 0;
    transition: opacity .25s;
}

#fruit-menu {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    width: min(850px,94vw);
    max-height: 82vh;
    overflow-y: auto;
    padding: 20px;
    background: rgba(5,8,18,.97);
    border: 2px solid #b000ff;
    border-radius: 18px;
    display: none;
    pointer-events: auto;
    box-shadow: 0 0 50px rgba(150,0,255,.35);
}

#fruit-menu h2 {
    color: #d500ff;
    text-align: center;
    margin-bottom: 5px;
}

#fruit-menu p {
    text-align: center;
    color: #aaa;
    margin-bottom: 15px;
}

.fruit-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
    gap: 12px;
}

.fruit-card {
    background: linear-gradient(145deg,#131a2b,#080c16);
    border: 2px solid #33405c;
    border-radius: 13px;
    padding: 14px;
    cursor: pointer;
    transition: .2s;
}

.fruit-card:hover {
    transform: translateY(-3px);
    border-color: #00eaff;
}

.fruit-card h3 {
    margin-bottom: 7px;
}

.fruit-card .type {
    color: #aaa;
    font-size: 11px;
    margin-bottom: 8px;
}

.fruit-card .skill-list {
    font-size: 12px;
    line-height: 1.65;
    color: #ddd;
}

#close-menu {
    display: block;
    margin: 18px auto 0;
    border: 0;
    background: #b000ff;
    color: white;
    padding: 10px 25px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: bold;
}

#hotbar {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 9px;
    padding: 10px;
    background: rgba(5,8,18,.94);
    border: 2px solid #263d68;
    border-radius: 15px;
    pointer-events: auto;
}

.skill {
    width: 105px;
    min-height: 70px;
    border: 2px solid #34435f;
    background: #11182a;
    border-radius: 10px;
    text-align: center;
    padding: 8px;
    position: relative;
    overflow: hidden;
}

.skill.active {
    border-color: #00eaff;
    box-shadow: 0 0 12px rgba(0,234,255,.4);
}

.skill .key {
    color: #00eaff;
    font-size: 19px;
    font-weight: 900;
}

.skill .name {
    font-size: 10px;
    margin-top: 5px;
    color: white;
}

.skill .cd {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.72);
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
    color: #fff;
}

#controls {
    position: absolute;
    left: 18px;
    bottom: 20px;
    background: rgba(0,0,0,.78);
    padding: 12px 15px;
    border-radius: 10px;
    color: #c8cfdb;
    font-size: 12px;
    line-height: 1.7;
}

#interaction {
    position: absolute;
    bottom: 125px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.8);
    border: 1px solid #00eaff;
    padding: 10px 18px;
    border-radius: 10px;
    color: white;
    display: none;
}

@media(max-width:700px) {
    #stats {
        width: 260px;
        transform: scale(.85);
        transform-origin: top left;
    }

    #quest {
        width: 230px;
        transform: scale(.8);
        transform-origin: top right;
    }

    #controls {
        display: none;
    }

    #hotbar {
        gap: 4px;
        padding: 5px;
    }

    .skill {
        width: 65px;
        min-height: 60px;
    }

    .skill .name {
        font-size: 8px;
    }
}
</style>
</head>

<body>

<div id="canvas-container"></div>

<div id="ui">

    <div id="stats" class="panel">
        <div class="title">
            NÍVEL <span id="level">1</span>
            |
            <span id="fruit-name">Fênix</span>
        </div>

        <div class="bar">
            <div id="hp-fill"></div>
        </div>

        <div class="bar">
            <div id="xp-fill"></div>
        </div>

        <div class="info">
            <span>HP: <b id="hp-text">150/150</b></span>
            <span>Beli: $<b id="beli">5000</b></span>
        </div>

        <div id="fruit-info">
            Fruta: Fênix
        </div>
    </div>

    <div id="quest" class="panel">
        <h3>📜 MISSÃO</h3>
        <div id="quest-text">
            Fale com o NPC azul usando E.
        </div>
    </div>

    <div id="npc-message"></div>

    <div id="interaction">
        Pressione <b>E</b> para interagir
    </div>

    <div id="fruit-menu">
        <h2>🍎 MERCADO DE FRUTAS</h2>
        <p>Escolha uma fruta para equipar.</p>

        <div id="fruit-grid" class="fruit-grid"></div>

        <button id="close-menu">FECHAR</button>
    </div>

    <div id="hotbar">
        <div class="skill active" id="skill-z">
            <div class="key">Z</div>
            <div class="name"></div>
            <div class="cd"></div>
        </div>

        <div class="skill" id="skill-x">
            <div class="key">X</div>
            <div class="name"></div>
            <div class="cd"></div>
        </div>

        <div class="skill" id="skill-c">
            <div class="key">C</div>
            <div class="name"></div>
            <div class="cd"></div>
        </div>

        <div class="skill" id="skill-v">
            <div class="key">V</div>
            <div class="name"></div>
            <div class="cd"></div>
        </div>

        <div class="skill" id="skill-f">
            <div class="key">F</div>
            <div class="name"></div>
            <div class="cd"></div>
        </div>
    </div>

    <div id="controls">
        <b>WASD</b> — Movimento<br>
        <b>Espaço</b> — Pular<br>
        <b>Z X C V F</b> — Skills<br>
        <b>E</b> — Interagir<br>
        <b>Mouse</b> — Câmera
    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* =========================================================
   FRUTAS
========================================================= */

const FRUITS = {

    phoenix: {
        name: "Fênix",
        type: "Mythical Zoan",
        color: "#00eaff",
        skills: {
            z: {name:"Garras Celestes", cd:2, damage:35},

            c: {name:"Investida Alada", cd:5, damage:65},
            v: {name:"Explosão Fênix", cd:9, damage:100},
            f: {name:"Renascimento Supremo", cd:15, damage:150}
        }
    },

    dragon: {
        name: "Dragão",
        type: "Mythical Zoan",
        color: "#a000ff",
        skills: {
            z: {name:"Garra do Dragão", cd:2, damage:45},
            x: {name:"Sopro de Fogo", cd:4, damage:70},
            c: {name:"Rugido Imperial", cd:5, damage:85},
            v: {name:"Tempestade Dracônica", cd:10, damage:130},
            f: {name:"Dragão Celestial", cd:16, damage:190}
        }
    },

    distortion: {
        name: "Distorção",
        type: "Paramecia",
        color: "#8a2be2",
        skills: {
            z: {name:"Fenda Espacial", cd:2, damage:40},
            x: {name:"Buraco Negro", cd:5, damage:75},
            c: {name:"Troca Dimensional", cd:6, damage:80},
            v: {name:"Colapso Espacial", cd:11, damage:135},
            f: {name:"Dimensão Absoluta", cd:17, damage:200}
        }
    },

    ice: {
        name: "Gelo Glacial",
        type: "Logia",
        color: "#00ffff",
        skills: {
            z: {name:"Lança Glacial", cd:2, damage:35},
            x: {name:"Espinhos de Gelo", cd:4, damage:55},
            c: {name:"Dragão Congelante", cd:6, damage:90},
            v: {name:"Tempestade de Gelo", cd:10, damage:125},
            f: {name:"Era Glacial", cd:15, damage:180}
        }
    },

    flame: {
        name: "Chama Solar",
        type: "Logia",
        color: "#ff4500",
        skills: {
            z: {name:"Punho Flamejante", cd:2, damage:40},
            x: {name:"Coluna Solar", cd:4, damage:65},
            c: {name:"Meteoros de Fogo", cd:6, damage:85},
            v: {name:"Inferno Solar", cd:10, damage:135},
            f: {name:"Supernova", cd:16, damage:210}
        }
    },

    dough: {
        name: "Dough / Massa",
        type: "Special Paramecia",
        color: "#ffcc88",
        skills: {
            z: {name:"Massa Chicote", cd:2, damage:45},
            x: {name:"Punho Donut", cd:4, damage:70},
            c: {name:"Massa Espinhosa", cd:6, damage:90},
            v: {name:"Tempestade de Donuts", cd:11, damage:145},
            f: {name:"Despertar da Massa", cd:17, damage:220}
        }
    }

};


/* =========================================================
   VARIÁVEIS DO JOGO
========================================================= */

const playerData = {
    level: 1,
    xp: 0,
    maxXp: 100,

    hp: 150,
    maxHp: 150,

    beli: 5000,

    currentFruit: "phoenix",

    speed: 0.35,
    vy: 0,
    grounded: true,

    questActive: false,
    questKills: 0,

    attack: false,

    nearbyNPC: null
};

const keys = {};
const cooldowns = {};

let cameraYaw = 0;
let cameraPitch = 0.35;
let mouseDown = false;

const enemies = [];
const effects = [];


/* =========================================================
   THREE.JS
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x263b5c);

scene.fog = new THREE.Fog(
    0x263b5c,
    100,
    600
);

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    2000
);

camera.position.set(0,20,35);


const renderer = new THREE.WebGLRenderer({
    antialias:true,
    alpha:false,
    powerPreference:"high-performance"
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio || 1,2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.outputEncoding = THREE.sRGBEncoding;

const container =
    document.getElementById("canvas-container");

container.innerHTML = "";
container.appendChild(renderer.domElement);


/* =========================================================
   LUZ
========================================================= */

const hemi = new THREE.HemisphereLight(
    0xffffff,
    0x304060,
    2.5
);

scene.add(hemi);


const sun = new THREE.DirectionalLight(
    0xffffff,
    3
);

sun.position.set(
    80,
    130,
    70
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

scene.add(sun);


const blueLight = new THREE.PointLight(
    0x44aaff,
    100,
    200
);

blueLight.position.set(
    0,
    40,
    30
);

scene.add(blueLight);


/* =========================================================
   MUNDO
========================================================= */

const oceanMaterial =
    new THREE.MeshStandardMaterial({
        color:0x087ca8,
        roughness:.2,
        metalness:.5
    });

const ocean =
    new THREE.Mesh(
        new THREE.PlaneGeometry(1000,1000),
        oceanMaterial
    );

ocean.rotation.x = -Math.PI/2;
ocean.position.y = -2;

ocean.receiveShadow = true;

scene.add(ocean);


const islandMaterial =
    new THREE.MeshStandardMaterial({
        color:0x3c5b3a,
        roughness:.9
    });

const island =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            65,
            70,
            6,
            48
        ),
        islandMaterial
    );

island.position.y = 1;

island.receiveShadow = true;

scene.add(island);


/* =========================================================
   DECORAÇÃO
========================================================= */

function createTree(x,z) {

    const group = new THREE.Group();

    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .45,
                .65,
                4,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0x714b2a
            })
        );

    trunk.position.y = 5;

    trunk.castShadow = true;

    group.add(trunk);


    const leaves =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                2.7,
                12,
                12
            ),
            new THREE.MeshStandardMaterial({
                color:0x168238
            })
        );

    leaves.position.y = 7;

    leaves.castShadow = true;

    group.add(leaves);

    group.position.set(x,0,z);

    scene.add(group);
}


for(let i=0;i<35;i++) {

    const angle =
        Math.random()*Math.PI*2;

    const radius =
        15 + Math.random()*45;

    createTree(
        Math.cos(angle)*radius,
        Math.sin(angle)*radius
    );
}


/* =========================================================
   PERSONAGEM
========================================================= */

function createCharacter(
    skinColor,
    shirtColor
) {

    const group = new THREE.Group();

    const skin =
        new THREE.MeshStandardMaterial({
            color:skinColor,
            roughness:.7
        });

    const shirt =
        new THREE.MeshStandardMaterial({
            color:shirtColor,
            roughness:.6
        });


    const torso =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.5,
                1.8,
                .8
            ),
            shirt
        );

    torso.position.y = 4.1;

    torso.castShadow = true;

    group.add(torso);


    const head =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.2,
                1.2,
                1.2
            ),
            skin
        );

    head.position.y = 5.7;

    head.castShadow = true;

    group.add(head);


    const armL =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .45,
                1.7,
                .45
            ),
            shirt
        );

    armL.position.set(
        -1.05,
        4.05,
        0
    );

    armL.castShadow = true;

    group.add(armL);


    const armR = armL.clone();

    armR.position.x = 1.05;

    group.add(armR);


    const legL =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .55,
                1.8,
                .55
            ),
            skin
        );

    legL.position.set(
        -.4,
        2.25,
        0
    );

    legL.castShadow = true;

    group.add(legL);


    const legR = legL.clone();

    legR.position.x = .4;

    group.add(legR);


    return group;
}


/* =========================================================
   PLAYER
========================================================= */

const player =
    createCharacter(
        0xffcc99,
        0x00aaff
    );

player.position.set(
    0,
    0,
    15
);

scene.add(player);


/* =========================================================
   NPC
========================================================= */

function createNPC(
    x,
    z,
    color,
    name
) {

    const npc =
        createCharacter(
            0xffcc99,
            color
        );

    npc.position.set(
        x,
        0,
        z
    );

    npc.userData.npc = name;

    scene.add(npc);

    return npc;
}


const fruitNPC =
    createNPC(
        10,
        -10,
        0xb000ff,
        "fruit"
    );


const questNPC =
    createNPC(
        -10,
        -10,
        0x0055ff,
        "quest"
    );


/* =========================================================
   PLACA NPC
========================================================= */

function createLabel(
    text,
    color,
    position
) {

    const canvas =
        document.createElement("canvas");

    canvas.width = 512;
    canvas.height = 128;

    const ctx =
        canvas.getContext("2d");

    ctx.fillStyle = "rgba(0,0,0,.75)";
    ctx.fillRect(0,0,512,128);

    ctx.font = "bold 42px Arial";

    ctx.textAlign = "center";

    ctx.fillStyle = color;

    ctx.fillText(
        text,
        256,
        78
    );

    const texture =
        new THREE.CanvasTexture(canvas);

    const material =
        new THREE.SpriteMaterial({
            map:texture,
            transparent:true
        });

    const sprite =
        new THREE.Sprite(material);

    sprite.scale.set(
        5,
        1.25,
        1
    );

    sprite.position.copy(position);

    scene.add(sprite);

    return sprite;
}


createLabel(
    "🍎 FRUTAS",
    "#ff00ff",
    new THREE.Vector3(10,8,-10)
);


createLabel(
    "📜 MISSÃO",
    "#00aaff",
    new THREE.Vector3(-10,8,-10)
);


/* =========================================================
   INIMIGOS
========================================================= */

function spawnEnemy(x,z) {

    const enemy =
        createCharacter(
            0xffaa88,
            0x242424
        );

    enemy.position.set(
        x,
        0,
        z
    );

    enemy.userData.hp = 100;
    enemy.userData.maxHp = 100;

    enemy.userData.spawnX = x;
    enemy.userData.spawnZ = z;

    enemy.userData.dead = false;

    scene.add(enemy);

    enemies.push(enemy);
}


spawnEnemy(20,5);
spawnEnemy(-20,5);
spawnEnemy(25,-15);
spawnEnemy(-25,-15);
spawnEnemy(0,-30);
spawnEnemy(30,25);
spawnEnemy(-30,25);


/* =========================================================
   EFEITOS
========================================================= */

function effectSphere(
    position,
    color,
    size,
    duration
) {

    const mesh =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                size,
                20,
                20
            ),
            new THREE.MeshBasicMaterial({
                color:color,
                transparent:true,
                opacity:.75
            })
        );

    mesh.position.copy(position);

    scene.add(mesh);

    effects.push({
        mesh,
        life:duration,
        max:duration,
        grow:size*.04
    });
}


function effectRing(
    position,
    color,
    size,
    duration
) {

    const mesh =
        new THREE.Mesh(
            new THREE.TorusGeometry(
                size,
                .15,
                8,
                32
            ),
            new THREE.MeshBasicMaterial({
                color:color,
                transparent:true,
                opacity:.9
            })
        );

    mesh.rotation.x =
        Math.PI/2;

    mesh.position.copy(position);

    scene.add(mesh);

    effects.push({
        mesh,
        life:duration,
        max:duration,
        grow:.08
    });
}


/* =========================================================
   DANO
========================================================= */

function damageEnemies(
    position,
    radius,
    damage
) {

    enemies.forEach(enemy => {

        if(enemy.userData.dead)
            return;

        const distance =
            enemy.position.distanceTo(
                position
            );

        if(distance <= radius) {

            enemy.userData.hp -= damage;

            effectSphere(
                enemy.position.clone()
                    .add(new THREE.Vector3(0,4,0)),
                0xff2244,
                .5,
                250
            );

            if(
                enemy.userData.hp <= 0
            ) {

                killEnemy(enemy);
            }
        }
    });
}


/* =========================================================
   MORTE INIMIGO
========================================================= */

function killEnemy(enemy) {

    if(enemy.userData.dead)
        return;

    enemy.userData.dead = true;

    playerData.xp += 30;

    playerData.beli += 100;

    if(playerData.questActive) {

        playerData.questKills++;

        updateQuest();
    }

    showMessage(
        "+30 XP  +100 Beli"
    );

    updateUI();


    setTimeout(() => {

        enemy.userData.hp =
            enemy.userData.maxHp;

        enemy.position.set(
            enemy.userData.spawnX,
            0,
            enemy.userData.spawnZ
        );

        enemy.userData.dead = false;

    },2500);
}


/* =========================================================
   LEVEL
========================================================= */

function checkLevel() {

    while(
        playerData.xp >=
        playerData.maxXp
    ) {

        playerData.xp -=
            playerData.maxXp;

        playerData.level++;

        playerData.maxXp =
            Math.floor(
                playerData.maxXp * 1.35
            );

        playerData.maxHp += 35;

        playerData.hp =
            playerData.maxHp;

        showMessage(
            "LEVEL UP! NÍVEL " +
            playerData.level
        );
    }
}

/* =========================================================
   COOLDOWN
========================================================= */

function startCooldown(
    key,
    seconds
) {

    const slot =
        document.getElementById(
            "skill-" + key
        );

    const cd =
        slot.querySelector(".cd");

    cd.style.display =
        "flex";

    let remaining =
        seconds;

    cd.textContent =
        remaining.toFixed(1);

    const interval =
        setInterval(() => {

            remaining -= .1;

            if(remaining <= 0) {

                clearInterval(interval);

                cooldowns[key] =
                    false;

                cd.style.display =
                    "none";

                return;
            }

            cd.textContent =
                remaining.toFixed(1);

        },100);
}
