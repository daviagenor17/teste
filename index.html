<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Blox Fruits - Giro 3D Ilimitado</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #05050f;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    #ui {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 30px;
    }
    .title {
      color: #fff;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
      background: rgba(10, 10, 25, 0.7);
      padding: 12px 30px;
      border-radius: 50px;
      border: 1px solid rgba(0, 240, 255, 0.3);
    }
    #result-box {
      text-align: center;
      transition: all 0.5s ease;
      opacity: 0;
      transform: translateY(20px);
    }
    #result-box.show {
      opacity: 1;
      transform: translateY(0);
    }
    .fruit-name {
      font-size: 42px;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 0 0 20px currentColor;
    }
    .fruit-rarity {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #aaa;
      margin-top: 5px;
    }
    #spin-btn {
      pointer-events: auto;
      background: linear-gradient(135deg, #ff0055, #ff5500);
      color: white;
      border: none;
      padding: 18px 50px;
      font-size: 22px;
      font-weight: 800;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 85, 0, 0.5);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    #spin-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 40px rgba(255, 85, 0, 0.8);
    }
    #spin-btn:disabled {
      background: #444;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>

  <div id="ui">
    <div class="title">Gacha Blox Fruits 3D</div>
    <div id="result-box">
      <div class="fruit-name" id="fruit-name">Mítica!</div>
      <div class="fruit-rarity" id="fruit-rarity">Raridade</div>
    </div>
    <button id="spin-btn" onclick="spinFruit()">GIRAR FRUTA</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // --- BANCO DE DADOS DE FRUTAS ---
    const FRUITS = [
      // Comuns
      { name: "Rocket", rarity: "Comum", color: 0x777777, prob: 25 },
      { name: "Spin", rarity: "Comum", color: 0x888888, prob: 20 },
      { name: "Chop", rarity: "Comum", color: 0x999999, prob: 15 },
      // Incomuns
      { name: "Flame", rarity: "Incomum", color: 0xff4500, prob: 12 },
      { name: "Ice", rarity: "Incomum", color: 0x00ffff, prob: 10 },
      { name: "Dark", rarity: "Incomum", color: 0x4b0082, prob: 8 },
      // Raras
      { name: "Light", rarity: "Rara", color: 0xffd700, prob: 5 },
      { name: "Magma", rarity: "Rara", color: 0xff1493, prob: 3 },
      { name: "Quake", rarity: "Rara", color: 0x8b4513, prob: 1.5 },
      // Lendárias
      { name: "Buddha", rarity: "Lendária", color: 0xffaa00, prob: 0.3 },
      { name: "Dough", rarity: "Lendária", color: 0xffb6c1, prob: 0.15 },
      // Míticas
      { name: "Venom", rarity: "Mítica", color: 0x9400d3, prob: 0.03 },
      { name: "Dragon", rarity: "Mítica", color: 0xd2143a, prob: 0.015 },
      { name: "Leopard", rarity: "Mítica", color: 0xff69b4, prob: 0.008 },
      { name: "Kitsune", rarity: "Mítica", color: 0x00f3ff, prob: 0.002 }
    ];

    const RARITY_COLORS = {
      "Comum": "#b0b0b0",
      "Incomum": "#55ff55",
      "Rara": "#0099ff",
      "Lendária": "#ffaa00",
      "Mítica": "#ff0055"
    };

    // --- CENA THREE.JS ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x05050f, 0.02);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // --- ILUMINAÇÃO ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const auraLight = new THREE.PointLight(0x00f3ff, 3, 20);
    auraLight.position.set(0, 1, 0);
    scene.add(auraLight);

    // Pedestal
    const pedestalGeo = new THREE.CylinderGeometry(1.5, 1.8, 0.4, 32);
    const pedestalMat = new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.3, metalness: 0.8 });
    const pedestal = new THREE.Mesh(pedestalGeo, pedestalMat);
    pedestal.position.y = -1.2;
    scene.add(pedestal);

    // --- GRUPO DA FRUTA 3D ---
    const fruitGroup = new THREE.Group();
    scene.add(fruitGroup);

    // Corpo da Fruta (Icosaedro estilizado estilo Blox Fruits)
    const fruitGeo = new THREE.IcosahedronGeometry(1.2, 1);
    const fruitMat = new THREE.MeshStandardMaterial({
      color: 0x00f3ff,
      roughness: 0.2,
      metalness: 0.3,
      wireframe: false
    });
    const fruitMesh = new THREE.Mesh(fruitGeo, fruitMat);
    fruitGroup.add(fruitMesh);

    // Anel de Energia ao redor da Fruta
    const ringGeo = new THREE.TorusGeometry(1.8, 0.04, 16, 100);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff });
    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
    ringMesh.rotation.x = Math.PI / 2;
    fruitGroup.add(ringMesh);

    // Partículas
    const particleCount = 60;
    const particleGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount * 3; i += 3) {
      positions[i] = (Math.random() - 0.5) * 5;
      positions[i+1] = (Math.random() - 0.5) * 5;
      positions[i+2] = (Math.random() - 0.5) * 5;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const particleMat = new THREE.PointsMaterial({ size: 0.06, color: 0x00f3ff, transparent: true, opacity: 0.8 });
    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    // --- LÓGICA DO GIRO ---
    let isSpinning = false;
    let spinTime = 0;
    let selectedFruit = null;

    function getRandomFruit() {
      const totalWeight = FRUITS.reduce((sum, f) => sum + f.prob, 0);
      let random = Math.random() * totalWeight;
      for (let fruit of FRUITS) {
        if (random < fruit.prob) return fruit;
        random -= fruit.prob;
      }
      return FRUITS[0];
    }

    function spinFruit() {
      if (isSpinning) return;
      
      isSpinning = true;
      spinTime = 0;
      document.getElementById('spin-btn').disabled = true;
      document.getElementById('result-box').classList.remove('show');
      
      selectedFruit = getRandomFruit();
    }

    // --- LOOP DE ANIMAÇÃO ---
    function animate() {
      requestAnimationFrame(animate);

      particles.rotation.y += 0.002;

      if (isSpinning) {
        spinTime += 0.016;

        // Animação de rotação rápida
        fruitGroup.rotation.y += 0.25;
        fruitGroup.rotation.x += 0.15;
        ringMesh.rotation.y += 0.3;

        // Efeito de oscilação de cor durante o giro
        const randomHue = Math.random();
        fruitMat.color.setHSL(randomHue, 1, 0.5);
        ringMat.color.setHSL(randomHue, 1, 0.5);
        auraLight.color.setHSL(randomHue, 1, 0.5);

        // Flutuação
        fruitGroup.position.y = Math.sin(spinTime * 10) * 0.2;

        // Final do Giro (após 3 segundos)
        if (spinTime >= 3) {
          isSpinning = false;
          document.getElementById('spin-btn').disabled = false;

          // Aplica cor e propriedades da fruta sorteada
          fruitMat.color.setHex(selectedFruit.color);
          ringMat.color.setHex(selectedFruit.color);
          auraLight.color.setHex(selectedFruit.color);
          particleMat.color.setHex(selectedFruit.color);

          // Exibe a UI do Resultado
          const nameEl = document.getElementById('fruit-name');
          const rarityEl = document.getElementById('fruit-rarity');
          
          nameEl.innerText = selectedFruit.name;
          nameEl.style.color = RARITY_COLORS[selectedFruit.rarity];
          rarityEl.innerText = `RARIDADE: ${selectedFruit.rarity.toUpperCase()}`;
          
          document.getElementById('result-box').classList.add('show');
        }
      } else {
        // Rotação suave normal quando ocioso
        fruitGroup.rotation.y += 0.01;
        fruitGroup.rotation.x = 0;
        ringMesh.rotation.y += 0.02;
        fruitGroup.position.y = Math.sin(Date.now() * 0.002) * 0.15;
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
