<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blox Fruits 3D - NPC do Giro e Hotbar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; background: #000; }
    
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
    
    #ui {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
    }

    /* BARRA DE STATUS */
    .status-bar {
      background: rgba(15, 15, 25, 0.85); backdrop-filter: blur(8px);
      border: 2px solid #00f3ff; border-radius: 12px; padding: 15px 25px;
      width: 320px; color: #fff;
    }
    .status-title { font-size: 16px; font-weight: 900; color: #00f3ff; margin-bottom: 8px; text-transform: uppercase; }
    .bar-container { background: #222; height: 14px; border-radius: 8px; overflow: hidden; margin-bottom: 6px; border: 1px solid #444; }
    .hp-bar { background: linear-gradient(90deg, #ff0055, #ff5500); width: 100%; height: 100%; transition: width 0.2s; }
    .xp-bar { background: linear-gradient(90deg, #00f3ff, #0055ff); width: 0%; height: 100%; transition: width 0.2s; }
    .info-text { font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; color: #ccc; }

    /* PAINEL DE MISSÃO */
    .quest-panel {
      position: absolute; top: 20px; right: 20px;
      background: rgba(15, 15, 25, 0.85); border: 2px solid #ffaa00;
      border-radius: 12px; padding: 15px; width: 260px; color: #fff;
    }
    .quest-title { color: #ffaa00; font-weight: 900; font-size: 16px; margin-bottom: 5px; }

    /* HOTBAR DE HABILIDADES */
    .hotbar-container {
      align-self: center; display: flex; gap: 12px; margin-bottom: 15px;
      background: rgba(10, 10, 20, 0.8); padding: 10px 20px; border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .hotbar-slot {
      background: rgba(20, 20, 35, 0.9); border: 2px solid #00f3ff;
      border-radius: 10px; padding: 10px; width: 95px; text-align: center; color: #fff;
      transition: all 0.2s;
    }
    .hotbar-slot.active { border-color: #ffd700; transform: scale(1.05); }
    .skill-key { font-size: 18px; font-weight: 900; color: #00f3ff; }
    .skill-name { font-size: 11px; font-weight: bold; margin-top: 4px; text-transform: uppercase; color: #fff; }

    .controls-guide {
      position: absolute; bottom: 20px; left: 20px;
      background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px;
      color: #aaa; font-size: 12px; border: 1px solid #333;
    }

    #center-msg {
      position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%);
      font-size: 30px; font-weight: 900; color: #ffd700; text-shadow: 0 0 20px #ff0055;
      opacity: 0; transition: opacity 0.3s; text-transform: uppercase; text-align: center; pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="ui">
    <div class="status-bar">
      <div class="status-title">Nível <span id="lbl-level">1</span> | <span id="lbl-fruit" style="color:#ffaa00">Chama</span></div>
      <div class="bar-container"><div id="hp-bar" class="hp-bar"></div></div>
      <div class="bar-container"><div id="xp-bar" class="xp-bar"></div></div>
      <div class="info-text">
        <span>HP: <span id="lbl-hp">100/100</span></span>
        <span>Beli: $<span id="lbl-beli">1000</span></span>
      </div>
    </div>

    <div class="quest-panel">
      <div class="quest-title">📜 Missão Atual</div>
      <div id="quest-desc" style="font-size: 13px; color: #ddd;">Fale com o NPC de Missões (Azul).</div>
      <div style="font-size: 12px; color: #ffaa00; margin-top: 8px;" id="quest-prog">Progresso: 0/3 Bandidos</div>
    </div>

    <div id="center-msg">MENSAGEM</div>

    <div class="hotbar-container">
      <div class="hotbar-slot"><div class="skill-key">Z</div><div class="skill-name" id="slot-z">Soco</div></div>
      <div class="hotbar-slot"><div class="skill-key">X</div><div class="skill-name" id="slot-x">Sopro Fogo</div></div>
      <div class="hotbar-slot"><div class="skill-key">C</div><div class="skill-name" id="slot-c">Meteoro</div></div>
    </div>

    <div class="controls-guide">
      <b>Movimento:</b> WASD | <b>Ataques:</b> Z, X, C | <b>Interagir (NPCs):</b> E<br>
      <span style="color:#ff00ea">NPC Roxo: Giro de Fruta ($500)</span> | <span style="color:#0055ff">NPC Azul: Missão</span>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // --- AUDIO SINTETIZADO ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    function playSound(type) {
      if(!audioCtx) audioCtx = new AudioCtx();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if(type==='hit') {
        osc.type = 'square'; osc.frequency.setValueAtTime(150, now);
        gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now+0.1);
        osc.start(now); osc.stop(now+0.1);
      } else if(type==='fire') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(80, now+0.3);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now+0.3);
        osc.start(now); osc.stop(now+0.3);
      } else if(type==='ice') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(200, now+0.25);
        gain.gain.setValueAtTime(0.25, now); gain.gain.linearRampToValueAtTime(0.01, now+0.25);
        osc.start(now); osc.stop(now+0.25);
      } else if(type==='gacha') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(900, now+0.5);
        gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0.01, now+0.5);
        osc.start(now); osc.stop(now+0.5);
      }
    }

    // --- DEFINIÇÃO DAS FRUTAS E PODERES ---
    const FRUITS = {
      flame: {
        name: "Chama", color: 0xff4500,
        skills: { z: "Soco de Fogo", x: "Sopro Fogo", c: "Meteoro" }
      },
      ice: {
        name: "Gelo", color: 0x00ffff,
        skills: { z: "Lança Gelo", x: "Prisão Gelo", c: "Tsunami Gelo" }
      },
      light: {
        name: "Luz", color: 0xffff00,
        skills: { z: "Raio Luz", x: "Explosão Sol", c: "Chuva de Luz" }
      },
      buddha: {
        name: "Buddha", color: 0xffaa00,
        skills: { z: "Soco Gigante", x: "Onda Choque", c: "Impacto Divino" }
      }
    };

    // --- CONFIGURAÇÃO THREE.JS ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x60c0ff);
    scene.fog = new THREE.FogExp2(0x60c0ff, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
    dirLight.position.set(50, 80, 50);
    scene.add(dirLight);

    // --- PERSONAGEM ROBLOX ---
    function createRobloxCharacter(colorBody, colorShirt) {
      const group = new THREE.Group();
      const matSkin = new THREE.MeshStandardMaterial({ color: colorBody, roughness: 0.5 });
      const matShirt = new THREE.MeshStandardMaterial({ color: colorShirt, roughness: 0.5 });

      const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), matSkin);
      head.position.y = 1.4;
      group.add(head);

      const torso = new THREE.Mesh(new THREE.BoxGeometry(1, 1.2, 0.5), matShirt);
      torso.position.y = 0.4;
      group.add(torso);

      const armL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), matShirt);
      armL.position.set(-0.7, 0.4, 0);
      group.add(armL);
      const armR = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), matShirt);
      armR.position.set(0.7, 0.4, 0);
      group.add(armR);

      const legL = new THREE.Mesh(new THREE.BoxGeometry(0.45, 1.2, 0.45), matSkin);
      legL.position.set(-0.25, -0.8, 0);
      group.add(legL);
      const legR = new THREE.Mesh(new THREE.BoxGeometry(0.45, 1.2, 0.45), matSkin);
      legR.position.set(0.25, -0.8, 0);
      group.add(legR);

      group.armR = armR;
      group.armL = armL;
      return group;
    }

    // --- ILHA E MUNDO ---
    const ocean = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshStandardMaterial({ color: 0x004488 }));
    ocean.rotation.x = -Math.PI / 2;
    ocean.position.y = -1;
    scene.add(ocean);

    const island = new THREE.Mesh(new THREE.CylinderGeometry(40, 45, 4, 32), new THREE.MeshStandardMaterial({ color: 0x22aa33 }));
    island.position.y = 1;
    scene.add(island);

    // NPC DE MISSÕES (AZUL)
    const npcQuest = createRobloxCharacter(0xffcc99, 0x0055ff);
    npcQuest.position.set(-6, 4, -8);
    scene.add(npcQuest);

    // NPC DO GIRO DE FRUTAS (ROXO)
    const npcGacha = createRobloxCharacter(0xffcc99, 0x9900ff);
    npcGacha.position.set(6, 4, -8);
    scene.add(npcGacha);

    // Marcadores acima dos NPCs
    const markerGacha = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff00ea }));
    markerGacha.position.set(6, 6.5, -8);
    scene.add(markerGacha);

    // --- JOGADOR ---
    const player = createRobloxCharacter(0xffcc99, 0xff2200);
    player.position.set(0, 4, 10);
    scene.add(player);

    const playerData = {
      level: 1, xp: 0, maxXp: 100,
      hp: 100, maxHp: 100, beli: 1000,
      questActive: false, questKills: 0,
      currentFruit: 'flame',
      speed: 0.25, isAttacking: false
    };

    // INIMIGOS
    const enemies = [];
    function spawnEnemy(x, z) {
      const enemy = createRobloxCharacter(0xffcc99, 0x333333);
      enemy.position.set(x, 4, z);
      enemy.hp = 60; enemy.maxHp = 60;
      enemy.spawnPos = { x, z };
      scene.add(enemy);
      enemies.push(enemy);
    }
    spawnEnemy(12, 5);
    spawnEnemy(-12, 0);
    spawnEnemy(15, -10);

    // CONTROLES
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if(e.code === 'KeyZ') castSkill('z');
      if(e.code === 'KeyX') castSkill('x');
      if(e.code === 'KeyC') castSkill('c');
      if(e.code === 'KeyE') interactNPCs();
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    // --- SISTEMA DE ATAQUES CONFORME A FRUTA ---
    function castSkill(slot) {
      if(playerData.isAttacking) return;
      playerData.isAttacking = true;

      const fruit = FRUITS[playerData.currentFruit];
      
      if(playerData.currentFruit === 'flame') {
        if(slot === 'z') attackFlameZ();
        if(slot === 'x') attackFlameX();
        if(slot === 'c') attackFlameC();
      } else if(playerData.currentFruit === 'ice') {
        if(slot === 'z') attackIceZ();
        if(slot === 'x') attackIceX();
        if(slot === 'c') attackIceC();
      } else if(playerData.currentFruit === 'light') {
        if(slot === 'z') attackLightZ();
        if(slot === 'x') attackLightX();
        if(slot === 'c') attackLightC();
      } else if(playerData.currentFruit === 'buddha') {
        if(slot === 'z') attackBuddhaZ();
        if(slot === 'x') attackBuddhaX();
        if(slot === 'c') attackBuddhaC();
      }
    }

    // ATANQUES CHAMA
    function attackFlameZ() {
      playSound('hit');
      player.armR.rotation.x = -Math.PI / 2;
      applyDamageInArea(player.position, 4, 25);
      setTimeout(() => { player.armR.rotation.x = 0; playerData.isAttacking = false; }, 200);
    }
    function attackFlameX() {
      playSound('fire');
      const fire = new THREE.Mesh(new THREE.ConeGeometry(2, 6, 8), new THREE.MeshBasicMaterial({ color: 0xff5500 }));
      fire.rotation.x = -Math.PI/2;
      fire.position.set(player.position.x, player.position.y + 0.5, player.position.z - 3);
      scene.add(fire);
      applyDamageInArea(player.position, 7, 45);
      setTimeout(() => { scene.remove(fire); playerData.isAttacking = false; }, 400);
    }
    function attackFlameC() {
      playSound('fire');
      const meteor = new THREE.Mesh(new THREE.SphereGeometry(2, 16, 16), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
      const target = player.position.clone().add(new THREE.Vector3(0, 0, -8));
      meteor.position.set(target.x, target.y + 15, target.z);
      scene.add(meteor);

      let drop = setInterval(() => {
        meteor.position.y -= 0.8;
        if(meteor.position.y <= 3) {
          clearInterval(drop);
          scene.remove(meteor);
          playSound('hit');
          applyDamageInArea(target, 8, 80);
          playerData.isAttacking = false;
        }
      }, 16);
    }

    // ATAQUES GELO
    function attackIceZ() {
      playSound('ice');
      const spike = new THREE.Mesh(new THREE.ConeGeometry(0.8, 4, 4), new THREE.MeshBasicMaterial({ color: 0x00ffff }));
      spike.rotation.x = -Math.PI / 2;
      spike.position.set(player.position.x, player.position.y, player.position.z - 4);
      scene.add(spike);
      applyDamageInArea(player.position, 5, 30);
      setTimeout(() => { scene.remove(spike); playerData.isAttacking = false; }, 300);
    }
    function attackIceX() {
      playSound('ice');
      const ring = new THREE.Mesh(new THREE.TorusGeometry(5, 0.3, 16, 32), new THREE.MeshBasicMaterial({ color: 0x00ffff }));
      ring.rotation.x = Math.PI / 2;
      ring.position.copy(player.position);
      scene.add(ring);
      applyDamageInArea(player.position, 6, 50);
      setTimeout(() => { scene.remove(ring); playerData.isAttacking = false; }, 500);
    }
    function attackIceC() {
      playSound('ice');
      applyDamageInArea(player.position, 10, 90);
      setTimeout(() => { playerData.isAttacking = false; }, 400);
    }

    // ATAQUES LUZ & BUDDHA (SIMPLIFICADOS)
    function attackLightZ() { playSound('hit'); applyDamageInArea(player.position, 6, 35); playerData.isAttacking = false; }
    function attackLightX() { playSound('fire'); applyDamageInArea(player.position, 8, 60); playerData.isAttacking = false; }
    function attackLightC() { playSound('fire'); applyDamageInArea(player.position, 12, 100); playerData.isAttacking = false; }

    function attackBuddhaZ() { playSound('hit'); applyDamageInArea(player.position, 5, 45); playerData.isAttacking = false; }
    function attackBuddhaX() { playSound('hit'); applyDamageInArea(player.position, 8, 70); playerData.isAttacking = false; }
    function attackBuddhaC() { playSound('fire'); applyDamageInArea(player.position, 12, 110); playerData.isAttacking = false; }

    function applyDamageInArea(pos, radius, damage) {
      enemies.forEach(e => {
        if(e.position.distanceTo(pos) <= radius) {
          e.hp -= damage;
          if(e.hp <= 0) {
            e.position.set(e.spawnPos.x, 4, e.spawnPos.z);
            e.hp = e.maxHp;
            addXP(45);
            playerData.beli += 80;

            if(playerData.questActive) {
              playerData.questKills++;
              if(playerData.questKills >= 3) {
                playerData.questActive = false;
                addXP(120);
                playerData.beli += 300;
                showCenterMsg("MISSÃO CONCLUÍDA! +$300");
              }
              updateUI();
            }
          }
        }
      });
    }

    // --- INTERAÇÃO COM NPCS ---
    function interactNPCs() {
      // NPC de Missão
      if(player.position.distanceTo(npcQuest.position) < 4) {
        playerData.questActive = true;
        playerData.questKills = 0;
        showCenterMsg("MISSÃO ACEITA: Derrote 3 Bandidos");
        updateUI();
      }

      // NPC de Giro de Frutas
      if(player.position.distanceTo(npcGacha.position) < 4) {
        if(playerData.beli < 500) {
          showCenterMsg("BELI INSUFICIENTE! ($500)");
          return;
        }

        playerData.beli -= 500;
        playSound('gacha');

        // Sorteia Fruta
        const fruitKeys = Object.keys(FRUITS);
        const randomFruitKey = fruitKeys[Math.floor(Math.random() * fruitKeys.length)];
        playerData.currentFruit = randomFruitKey;

        showCenterMsg(`VOCÊ GANHOU A FRUTA ${FRUITS[randomFruitKey].name.toUpperCase()}!`);
        updateUI();
      }
    }

    function addXP(amount) {
      playerData.xp += amount;
      if(playerData.xp >= playerData.maxXp) {
        playerData.level++;
        playerData.xp = 0;
        playerData.maxXp = Math.floor(playerData.maxXp * 1.5);
        playerData.maxHp += 25;
        playerData.hp = playerData.maxHp;
        showCenterMsg("LEVEL UP! NV " + playerData.level);
      }
      updateUI();
    }

    function showCenterMsg(text) {
      const msg = document.getElementById('center-msg');
      msg.innerText = text;
      msg.style.opacity = 1;
      setTimeout(() => msg.style.opacity = 0, 2500);
    }

    function updateUI() {
      const fruit = FRUITS[playerData.currentFruit];
      document.getElementById('lbl-level').innerText = playerData.level;
      document.getElementById('lbl-fruit').innerText = fruit.name;
      document.getElementById('lbl-hp').innerText = `${Math.floor(playerData.hp)}/${playerData.maxHp}`;
      document.getElementById('lbl-beli').innerText = playerData.beli;
      
      document.getElementById('hp-bar').style.width = `${(playerData.hp / playerData.maxHp) * 100}%`;
      document.getElementById('xp-bar').style.width = `${(playerData.xp / playerData.maxXp) * 100}%`;

      // Atualiza Hotbar com Habilidades da Fruta Atual
      document.getElementById('slot-z').innerText = fruit.skills.z;
      document.getElementById('slot-x').innerText = fruit.skills.x;
      document.getElementById('slot-c').innerText = fruit.skills.c;

      const questDesc = document.getElementById('quest-desc');
      const questProg = document.getElementById('quest-prog');
      if(playerData.questActive) {
        questDesc.innerText = "Derrote os Bandidos na ilha.";
        questProg.innerText = `Progresso: ${playerData.questKills}/3 Bandidos`;
      } else {
        questDesc.innerText = "Fale com o NPC de Missões (Azul).";
        questProg.innerText = "Nenhuma missão ativa";
      }
    }

    // --- LOOP PRINCIPAL (60 FPS) ---
    function animate() {
      requestAnimationFrame(animate);

      if(keys['KeyW']) player.position.z -= playerData.speed;
      if(keys['KeyS']) player.position.z += playerData.speed;
      if(keys['KeyA']) player.position.x -= playerData.speed;
      if(keys['KeyD']) player.position.x += playerData.speed;

      const dist = Math.hypot(player.position.x, player.position.z);
      if(dist > 38) { player.position.x *= 0.98; player.position.z *= 0.98; }

      camera.position.set(player.position.x, player.position.y + 8, player.position.z + 12);
      camera.lookAt(player.position.x, player.position.y + 1, player.position.z);

      // IA dos Inimigos
      enemies.forEach(enemy => {
        const d = enemy.position.distanceTo(player.position);
        if(d < 12 && d > 1.8) {
          const dir = player.position.clone().sub(enemy.position).normalize();
          enemy.position.x += dir.x * 0.05;
          enemy.position.z += dir.z * 0.05;
        } else if(d <= 1.8) {
          playerData.hp = Math.max(0, playerData.hp - 0.2);
          updateUI();
          if(playerData.hp === 0) {
            player.position.set(0, 4, 10);
            playerData.hp = playerData.maxHp;
            showCenterMsg("VOCÊ MORREU!");
            updateUI();
          }
        }
      });

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    updateUI();
    animate();
  </script>
</body>
</html>
