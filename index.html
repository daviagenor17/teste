<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blox Fruits 3D - RPG Roblox</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; background: #000; }
    
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
    
    /* INTERFACE DE USUÁRIO (ROBLOX STYLE) */
    #ui {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
    }

    /* BARRA SUPERIOR DE STATUS */
    .status-bar {
      background: rgba(15, 15, 25, 0.85); backdrop-filter: blur(8px);
      border: 2px solid #00f3ff; border-radius: 12px; padding: 15px 25px;
      width: 320px; color: #fff;
    }
    .status-title { font-size: 18px; font-weight: 900; color: #00f3ff; margin-bottom: 8px; text-transform: uppercase; }
    .bar-container { background: #222; height: 16px; border-radius: 8px; overflow: hidden; margin-bottom: 8px; border: 1px solid #444; }
    .hp-bar { background: linear-gradient(90deg, #ff0055, #ff5500); width: 100%; height: 100%; transition: width 0.2s; }
    .xp-bar { background: linear-gradient(90deg, #00f3ff, #0055ff); width: 0%; height: 100%; transition: width 0.2s; }
    .info-text { font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; color: #ccc; }

    /* PAINEL DE MISSÃO */
    .quest-panel {
      position: absolute; top: 20px; right: 20px;
      background: rgba(15, 15, 25, 0.85); border: 2px solid #ffaa00;
      border-radius: 12px; padding: 15px; width: 250px; color: #fff;
    }
    .quest-title { color: #ffaa00; font-weight: 900; font-size: 16px; margin-bottom: 5px; }

    /* HABILIDADES / FRUTA (PARTE INFERIOR) */
    .skills-bar {
      align-self: center; display: flex; gap: 15px; margin-bottom: 10px;
    }
    .skill-slot {
      background: rgba(10, 10, 20, 0.9); border: 2px solid #00f3ff;
      border-radius: 10px; padding: 12px; width: 90px; text-align: center; color: #fff;
    }
    .skill-key { font-size: 20px; font-weight: 900; color: #00f3ff; }
    .skill-name { font-size: 11px; font-weight: bold; margin-top: 4px; text-transform: uppercase; color: #aaa; }

    /* CONTROLES / GUIA */
    .controls-guide {
      position: absolute; bottom: 20px; left: 20px;
      background: rgba(0,0,0,0.6); padding: 10px 15px; border-radius: 8px;
      color: #aaa; font-size: 12px;
    }

    /* MENSAGEM NO CENTRO DA TELA */
    #center-msg {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
      font-size: 32px; font-weight: 900; color: #ffd700; text-shadow: 0 0 20px #ff0055;
      opacity: 0; transition: opacity 0.3s; text-transform: uppercase; text-align: center;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="ui">
    <div class="status-bar">
      <div class="status-title">Nível <span id="lbl-level">1</span> (Fruta: Chama)</div>
      <div class="bar-container"><div id="hp-bar" class="hp-bar"></div></div>
      <div class="bar-container"><div id="xp-bar" class="xp-bar"></div></div>
      <div class="info-text">
        <span>HP: <span id="lbl-hp">100/100</span></span>
        <span>Beli: $<span id="lbl-beli">0</span></span>
      </div>
    </div>

    <div class="quest-panel">
      <div class="quest-title">📜 Missão Atual</div>
      <div id="quest-desc" style="font-size: 13px; color: #ddd;">Fale com o NPC de Missões na praça.</div>
      <div style="font-size: 12px; color: #ffaa00; margin-top: 8px;" id="quest-prog">Progresso: 0/3 Bandidos</div>
    </div>

    <div id="center-msg">LEVEL UP!</div>

    <div class="skills-bar">
      <div class="skill-slot"><div class="skill-key">Z</div><div class="skill-name">Soco</div></div>
      <div class="skill-slot"><div class="skill-key">X</div><div class="skill-name">Sopro de Fogo</div></div>
      <div class="skill-slot"><div class="skill-key">C</div><div class="skill-name">Meteoro</div></div>
    </div>

    <div class="controls-guide">
      <b>Movimento:</b> WASD | <b>Pulo:</b> Espaço | <b>Ataque:</b> Z, X, C | <b>Interagir:</b> E
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // --- GERENCIADOR DE ÁUDIO SINTETIZADO ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    function playSound(type) {
      if(!audioCtx) audioCtx = new AudioCtx();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if(type==='hit') {
        osc.type = 'square'; osc.frequency.setValueAtTime(150, now);
        gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now+0.1);
        osc.start(now); osc.stop(now+0.1);
      } else if(type==='fire') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(80, now+0.3);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now+0.3);
        osc.start(now); osc.stop(now+0.3);
      } else if(type==='levelup') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(800, now+0.5);
        gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0.01, now+0.5);
        osc.start(now); osc.stop(now+0.5);
      }
    }

    // --- CONFIGURAÇÃO THREE.JS ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x60c0ff);
    scene.fog = new THREE.FogExp2(0x60c0ff, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // Luzes
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
    dirLight.position.set(50, 80, 50);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // --- CONSTRUTOR DE PERSONAGEM ROBLOX (AVATAR BLOCADO) ---
    function createRobloxCharacter(colorBody, colorShirt) {
      const group = new THREE.Group();
      const matSkin = new THREE.MeshStandardMaterial({ color: colorBody, roughness: 0.5 });
      const matShirt = new THREE.MeshStandardMaterial({ color: colorShirt, roughness: 0.5 });

      // Cabeça
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), matSkin);
      head.position.y = 1.4;
      group.add(head);

      // Torso
      const torso = new THREE.Mesh(new THREE.BoxGeometry(1, 1.2, 0.5), matShirt);
      torso.position.y = 0.4;
      group.add(torso);

      // Braços
      const armL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), matShirt);
      armL.position.set(-0.7, 0.4, 0);
      group.add(armL);
      const armR = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), matShirt);
      armR.position.set(0.7, 0.4, 0);
      group.add(armR);

      // Pernas
      const legL = new THREE.Mesh(new THREE.BoxGeometry(0.45, 1.2, 0.45), matSkin);
      legL.position.set(-0.25, -0.8, 0);
      group.add(legL);
      const legR = new THREE.Mesh(new THREE.BoxGeometry(0.45, 1.2, 0.45), matSkin);
      legR.position.set(0.25, -0.8, 0);
      group.add(legR);

      group.armR = armR;
      group.armL = armL;
      return group;
    }

    // --- CONSTRUÇÃO DO MUNDO (ILHA INICIAL DO BLOX FRUITS) ---
    // Oceano
    const ocean = new THREE.Mesh(
      new THREE.PlaneGeometry(600, 600),
      new THREE.MeshStandardMaterial({ color: 0x004488, roughness: 0.1, metalness: 0.8 })
    );
    ocean.rotation.x = -Math.PI / 2;
    ocean.position.y = -1;
    scene.add(ocean);

    // Ilha Principal (Grama)
    const islandGeo = new THREE.CylinderGeometry(40, 45, 4, 32);
    const islandMat = new THREE.MeshStandardMaterial({ color: 0x22aa33, roughness: 0.8 });
    const island = new THREE.Mesh(islandGeo, islandMat);
    island.position.y = 1;
    scene.add(island);

    // Árvores Decorativas
    for(let i=0; i<12; i++) {
      const angle = (i/12) * Math.PI * 2;
      const dist = 18 + Math.random() * 15;
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 3), new THREE.MeshStandardMaterial({ color: 0x553311 }));
      const leaves = new THREE.Mesh(new THREE.SphereGeometry(1.8, 8, 8), new THREE.MeshStandardMaterial({ color: 0x118822 }));
      trunk.position.set(Math.cos(angle)*dist, 4.5, Math.sin(angle)*dist);
      leaves.position.set(Math.cos(angle)*dist, 6.5, Math.sin(angle)*dist);
      scene.add(trunk); scene.add(leaves);
    }

    // NPC de Missões (Azul)
    const npcQuest = createRobloxCharacter(0xffcc99, 0x0055ff);
    npcQuest.position.set(0, 4, -8);
    scene.add(npcQuest);

    // Marcador de Texto no NPC
    const npcMarker = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.3, 0.1), new THREE.MeshBasicMaterial({ color: 0xffaa00 }));
    npcMarker.position.set(0, 6.2, -8);
    scene.add(npcMarker);

    // --- JOGADOR ---
    const player = createRobloxCharacter(0xffcc99, 0xff2200);
    player.position.set(0, 4, 10);
    scene.add(player);

    const playerData = {
      level: 1, xp: 0, maxXp: 100,
      hp: 100, maxHp: 100, beli: 0,
      questActive: false, questKills: 0,
      speed: 0.25, isAttacking: false
    };

    // --- INIMIGOS (BANDIDOS) ---
    const enemies = [];
    function spawnEnemy(x, z) {
      const enemy = createRobloxCharacter(0xffcc99, 0x333333);
      enemy.position.set(x, 4, z);
      enemy.hp = 50;
      enemy.maxHp = 50;
      enemy.spawnPos = { x, z };
      scene.add(enemy);
      enemies.push(enemy);
    }
    spawnEnemy(12, 5);
    spawnEnemy(-12, 0);
    spawnEnemy(15, -10);

    // --- CONTROLES TECLADO ---
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if(e.code === 'KeyZ') attackPunch();
      if(e.code === 'KeyX') attackFireBreath();
      if(e.code === 'KeyC') attackMeteor();
      if(e.code === 'KeyE') interactNPC();
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    // --- SISTEMA DE ATAQUES E HABILIDADES (FRUTA CHAMA) ---
    function attackPunch() {
      if(playerData.isAttacking) return;
      playerData.isAttacking = true;
      playSound('hit');

      // Animação de Soco
      player.armR.rotation.x = -Math.PI / 2;

      // Dano em Área Curta
      enemies.forEach(e => {
        if(e.position.distanceTo(player.position) < 3.5) {
          damageEnemy(e, 20 + playerData.level * 5);
        }
      });

      setTimeout(() => {
        player.armR.rotation.x = 0;
        playerData.isAttacking = false;
      }, 250);
    }

    function attackFireBreath() {
      if(playerData.isAttacking) return;
      playerData.isAttacking = true;
      playSound('fire');

      // Efeito Visual de Fogo
      const fireGeo = new THREE.ConeGeometry(2, 6, 8);
      const fireMat = new THREE.MeshBasicMaterial({ color: 0xff5500, transparent: true, opacity: 0.8 });
      const fireMesh = new THREE.Mesh(fireGeo, fireMat);
      fireMesh.rotation.x = -Math.PI / 2;
      fireMesh.position.set(player.position.x, player.position.y + 0.5, player.position.z - 3);
      scene.add(fireMesh);

      enemies.forEach(e => {
        if(e.position.distanceTo(player.position) < 7) {
          damageEnemy(e, 40 + playerData.level * 8);
        }
      });

      setTimeout(() => {
        scene.remove(fireMesh);
        playerData.isAttacking = false;
      }, 400);
    }

    function attackMeteor() {
      if(playerData.isAttacking) return;
      playerData.isAttacking = true;
      playSound('fire');

      // Meteoro caindo do céu
      const meteorMat = new THREE.MeshStandardMaterial({ color: 0xff2200, emissive: 0xaa1100 });
      const meteor = new THREE.Mesh(new THREE.SphereGeometry(2, 16, 16), meteorMat);
      const targetPos = player.position.clone().add(new THREE.Vector3(0, 0, -8));
      meteor.position.set(targetPos.x, targetPos.y + 15, targetPos.z);
      scene.add(meteor);

      let dropInterval = setInterval(() => {
        meteor.position.y -= 0.8;
        if(meteor.position.y <= 3) {
          clearInterval(dropInterval);
          scene.remove(meteor);
          playSound('hit');

          // Impacto do Meteoro
          enemies.forEach(e => {
            if(e.position.distanceTo(targetPos) < 8) {
              damageEnemy(e, 75 + playerData.level * 12);
            }
          });
          playerData.isAttacking = false;
        }
      }, 16);
    }

    function damageEnemy(e, damage) {
      e.hp -= damage;
      // Efeito do inimigo recuando
      e.position.z += 0.5;

      if(e.hp <= 0) {
        // Inimigo Derrotado
        e.position.set(e.spawnPos.x, 4, e.spawnPos.z);
        e.hp = e.maxHp;

        addXP(40);
        playerData.beli += 50;

        if(playerData.questActive) {
          playerData.questKills++;
          if(playerData.questKills >= 3) {
            playerData.questActive = false;
            addXP(100);
            playerData.beli += 200;
            showCenterMsg("MISSÃO CONCLUÍDA! +$200");
          }
          updateUI();
        }
      }
    }

    function addXP(amount) {
      playerData.xp += amount;
      if(playerData.xp >= playerData.maxXp) {
        playerData.level++;
        playerData.xp = 0;
        playerData.maxXp = Math.floor(playerData.maxXp * 1.5);
        playerData.maxHp += 20;
        playerData.hp = playerData.maxHp;
        playSound('levelup');
        showCenterMsg("LEVEL UP! NV " + playerData.level);
      }
      updateUI();
    }

    function interactNPC() {
      if(player.position.distanceTo(npcQuest.position) < 4) {
        playerData.questActive = true;
        playerData.questKills = 0;
        showCenterMsg("MISSÃO ACEITA: Derrote 3 Bandidos");
        updateUI();
      }
    }

    function showCenterMsg(text) {
      const msg = document.getElementById('center-msg');
      msg.innerText = text;
      msg.style.opacity = 1;
      setTimeout(() => msg.style.opacity = 0, 2500);
    }

    function updateUI() {
      document.getElementById('lbl-level').innerText = playerData.level;
      document.getElementById('lbl-hp').innerText = `${playerData.hp}/${playerData.maxHp}`;
      document.getElementById('lbl-beli').innerText = playerData.beli;
      
      document.getElementById('hp-bar').style.width = `${(playerData.hp / playerData.maxHp) * 100}%`;
      document.getElementById('xp-bar').style.width = `${(playerData.xp / playerData.maxXp) * 100}%`;

      const questDesc = document.getElementById('quest-desc');
      const questProg = document.getElementById('quest-prog');
      if(playerData.questActive) {
        questDesc.innerText = "Derrote os Bandidos na ilha.";
        questProg.innerText = `Progresso: ${playerData.questKills}/3 Bandidos`;
      } else {
        questDesc.innerText = "Fale com o NPC de Missões na praça.";
        questProg.innerText = "Nenhuma missão ativa";
      }
    }

    // --- LOOP DE ATUALIZAÇÃO DO JOGO (60 FPS) ---
    function animate() {
      requestAnimationFrame(animate);

      // Movimentação do Jogador (WASD)
      if(keys['KeyW']) player.position.z -= playerData.speed;
      if(keys['KeyS']) player.position.z += playerData.speed;
      if(keys['KeyA']) player.position.x -= playerData.speed;
      if(keys['KeyD']) player.position.x += playerData.speed;

      // Limite da Ilha (Não cair na água)
      const distFromCenter = Math.hypot(player.position.x, player.position.z);
      if(distFromCenter > 38) {
        player.position.x *= 0.98;
        player.position.z *= 0.98;
      }

      // Câmera estilo Roblox (Acompanha o Jogador em 3ª pessoa)
      camera.position.set(player.position.x, player.position.y + 8, player.position.z + 12);
      camera.lookAt(player.position.x, player.position.y + 1, player.position.z);

      // Inteligência Artificial dos Inimigos (IA de Perseguição)
      enemies.forEach(enemy => {
        const distToPlayer = enemy.position.distanceTo(player.position);
        
        // Se o jogador chegar perto, o bandido persegue e ataca
        if(distToPlayer < 12 && distToPlayer > 1.8) {
          const dir = player.position.clone().sub(enemy.position).normalize();
          enemy.position.x += dir.x * 0.05;
          enemy.position.z += dir.z * 0.05;
        } else if(distToPlayer <= 1.8) {
          // Inimigo Ataca o Jogador
          playerData.hp = Math.max(0, playerData.hp - 0.2);
          updateUI();
          if(playerData.hp === 0) {
            // Respawn do jogador
            player.position.set(0, 4, 10);
            playerData.hp = playerData.maxHp;
            showCenterMsg("VOCÊ MORREU!");
            updateUI();
          }
        }
      });

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
