<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blox Fruits 3D Ultra Gacha</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #020208;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      user-select: none;
    }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    #ui {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 10; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 25px;
    }
    .header {
      display: flex; justify-content: space-between; align-items: center;
    }
    .title {
      font-size: 28px; font-weight: 900; letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(45deg, #00f3ff, #ff0055);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
    }
    .inventory {
      background: rgba(10, 10, 25, 0.75); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 20px; border-radius: 15px; font-size: 14px;
      display: flex; gap: 15px;
    }
    .inv-item span { font-weight: bold; }
    
    #result-box {
      align-self: center; text-align: center;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      opacity: 0; transform: scale(0.5);
    }
    #result-box.show { opacity: 1; transform: scale(1); }
    .fruit-name {
      font-size: 56px; font-weight: 900; text-transform: uppercase;
      letter-spacing: 3px; filter: drop-shadow(0 0 25px currentColor);
    }
    .fruit-rarity {
      font-size: 20px; font-weight: 800; letter-spacing: 4px;
      color: #aaa; margin-top: -5px; text-transform: uppercase;
    }

    .controls { align-self: center; margin-bottom: 20px; }
    #spin-btn {
      pointer-events: auto;
      background: linear-gradient(135deg, #00f3ff, #ff00aa);
      color: #fff; border: none; padding: 20px 60px;
      font-size: 24px; font-weight: 900; border-radius: 50px;
      cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.5);
      transition: all 0.2s ease;
    }
    #spin-btn:hover { transform: scale(1.08); box-shadow: 0 0 50px rgba(255, 0, 170, 0.8); }
    #spin-btn:disabled { background: #333; box-shadow: none; cursor: not-allowed; transform: none; opacity: 0.5; }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="ui">
    <div class="header">
      <div class="title">Blox Fruits 3D Ultra</div>
      <div class="inventory">
        <div class="inv-item" style="color:#b0b0b0">Comum: <span id="c-comum">0</span></div>
        <div class="inv-item" style="color:#55ff55">Incomum: <span id="c-incomum">0</span></div>
        <div class="inv-item" style="color:#0099ff">Rara: <span id="c-rara">0</span></div>
        <div class="inv-item" style="color:#ffaa00">Lendária: <span id="c-lendaria">0</span></div>
        <div class="inv-item" style="color:#ff0055">Mítica: <span id="c-mitica">0</span></div>
      </div>
    </div>

    <div id="result-box">
      <div class="fruit-name" id="fruit-name">KITSUNE</div>
      <div class="fruit-rarity" id="fruit-rarity">MÍTICA</div>
    </div>

    <div class="controls">
      <button id="spin-btn" onclick="spin()">GIRAR FRUTA</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // --- ÁUDIO SINTETIZADO ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    function initAudio() { if(!audioCtx) audioCtx = new AudioContext(); }

    function playSound(type) {
      if(!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if(type === 'tick') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(300 + Math.random()*200, now);
        gain.gain.setValueAtTime(0.05, now); gain.gain.linearRampToValueAtTime(0.001, now + 0.05);
        osc.start(now); osc.stop(now + 0.05);
      } else if(type === 'reveal') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.4);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
        osc.start(now); osc.stop(now + 0.5);
      }
    }

    // --- BASE DE DADOS DAS FRUTAS ---
    const FRUITS = [
      { id: 'rocket', name: 'Rocket', rarity: 'Comum', color: 0x888888, prob: 30 },
      { id: 'flame', name: 'Flame', rarity: 'Incomum', color: 0xff4500, prob: 25 },
      { id: 'ice', name: 'Ice', rarity: 'Incomum', color: 0x00ffff, prob: 20 },
      { id: 'light', name: 'Light', rarity: 'Rara', color: 0xffd700, prob: 12 },
      { id: 'buddha', name: 'Buddha', rarity: 'Lendária', color: 0xffaa00, prob: 8 },
      { id: 'dragon', name: 'Dragon', rarity: 'Mítica', color: 0xd2143a, prob: 3.5 },
      { id: 'kitsune', name: 'Kitsune', rarity: 'Mítica', color: 0x00f3ff, prob: 1.5 }
    ];

    const RARITY_COLORS = {
      'Comum': '#b0b0b0', 'Incomum': '#55ff55', 'Rara': '#0099ff', 'Lendária': '#ffaa00', 'Mítica': '#ff0055'
    };
    const counts = { Comum: 0, Incomum: 0, Rara: 0, Lendária: 0, Mítica: 0 };

    // --- CENA THREE.JS ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020208, 0.03);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // --- ILUMINAÇÃO ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const mainLight = new THREE.PointLight(0xffffff, 2, 20);
    mainLight.position.set(0, 4, 3);
    scene.add(mainLight);

    const auraLight = new THREE.PointLight(0x00f3ff, 4, 15);
    auraLight.position.set(0, 0, 0);
    scene.add(auraLight);

    // Pedestal
    const pedGeo = new THREE.CylinderGeometry(1.6, 2, 0.5, 32);
    const pedMat = new THREE.MeshStandardMaterial({ color: 0x111122, metalness: 0.9, roughness: 0.2 });
    const pedestal = new THREE.Mesh(pedGeo, pedMat);
    pedestal.position.y = -1.5;
    scene.add(pedestal);

    // Anel de Onda de Choque (Efeito de Revelação)
    const shockGeo = new THREE.RingGeometry(0.1, 0.5, 32);
    const shockMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0 });
    const shockwave = new THREE.Mesh(shockGeo, shockMat);
    shockwave.rotation.x = Math.PI / 2;
    shockwave.position.y = -1.2;
    scene.add(shockwave);

    // --- MODELADOR PROCEDURAL DE FRUTAS 3D ---
    const fruitContainer = new THREE.Group();
    scene.add(fruitContainer);

    function buildFruitModel(id, color) {
      // Limpa modelo anterior
      while(fruitContainer.children.length > 0) {
        fruitContainer.remove(fruitContainer.children[0]);
      }

      const group = new THREE.Group();

      if(id === 'flame') {
        // Fruta de Fogo (Esfera + Chamas em volta)
        const core = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 16), new THREE.MeshStandardMaterial({ color: 0xff4500, emissive: 0xaa2200 }));
        group.add(core);
        for(let i=0; i<12; i++) {
          const flame = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.8, 8), new THREE.MeshBasicMaterial({ color: 0xffaa00 }));
          flame.position.set((Math.random()-0.5)*1.6, (Math.random()-0.5)*1.6, (Math.random()-0.5)*1.6);
          flame.rotation.x = Math.random()*Math.PI;
          group.add(flame);
        }
      } 
      else if(id === 'ice') {
        // Fruta de Gelo (Cubo Cristalino + Espinhos)
        const core = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshPhysicalMaterial({ color: 0x00ffff, transmission: 0.6, opacity: 1, transparent: true, roughness: 0.1 }));
        group.add(core);
        for(let i=0; i<8; i++) {
          const spike = new THREE.Mesh(new THREE.ConeGeometry(0.2, 1, 4), new THREE.MeshBasicMaterial({ color: 0xffffff }));
          spike.position.set((Math.random()-0.5)*1.4, (Math.random()-0.5)*1.4, (Math.random()-0.5)*1.4);
          spike.rotation.set(Math.random()*3, Math.random()*3, 0);
          group.add(spike);
        }
      }
      else if(id === 'light') {
        // Fruta da Luz (Octaedro Dourado + Anéis de Luz)
        const core = new THREE.Mesh(new THREE.OctahedronGeometry(1.1, 0), new THREE.MeshBasicMaterial({ color: 0xffff00 }));
        group.add(core);
        const ring = new THREE.Mesh(new THREE.TorusGeometry(1.6, 0.05, 16, 50), new THREE.MeshBasicMaterial({ color: 0xffd700 }));
        group.add(ring);
      }
      else if(id === 'buddha') {
        // Buddha (Estátua/Esfera Dourada com Halo)
        const core = new THREE.Mesh(new THREE.SphereGeometry(1.1, 32, 32), new THREE.MeshStandardMaterial({ color: 0xffaa00, metalness: 0.9, roughness: 0.1 }));
        group.add(core);
        const halo = new THREE.Mesh(new THREE.TorusGeometry(1.5, 0.08, 16, 50), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        halo.rotation.x = Math.PI/3;
        group.add(halo);
      }
      else if(id === 'dragon') {
        // Dragon (Esfera Vermelha + Chifres Negros)
        const core = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 16), new THREE.MeshStandardMaterial({ color: 0xd2143a, roughness: 0.3 }));
        group.add(core);
        for(let i=0; i<6; i++) {
          const horn = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.9, 8), new THREE.MeshStandardMaterial({ color: 0x111111 }));
          horn.position.set((i%2===0?0.6:-0.6), 0.3 + (i*0.2), (Math.random()-0.5));
          horn.rotation.z = (i%2===0?-0.5:0.5);
          group.add(horn);
        }
      }
      else if(id === 'kitsune') {
        // Kitsune (Núcleo Mágico + Caudas em Arco)
        const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.9, 2), new THREE.MeshBasicMaterial({ color: 0x00f3ff }));
        group.add(core);
        for(let i=0; i<9; i++) {
          const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.25, 1.5, 8), new THREE.MeshBasicMaterial({ color: 0x00f3ff }));
          const angle = (i / 9) * Math.PI * 2;
          tail.position.set(Math.cos(angle)*0.8, Math.sin(angle)*0.8, -0.2);
          tail.rotation.z = angle - Math.PI/2;
          group.add(tail);
        }
      }
      else {
        // Rocket / Genérica (Dodecaedro Stylized)
        const core = new THREE.Mesh(new THREE.DodecahedronGeometry(1), new THREE.MeshStandardMaterial({ color: color, roughness: 0.4 }));
        group.add(core);
      }

      fruitContainer.add(group);
    }

    // --- PARTÍCULAS DE AURA ---
    const pCount = 80;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(pCount * 3);
    for(let i=0; i<pCount*3; i+=3) {
      pPos[i] = (Math.random()-0.5)*6;
      pPos[i+1] = (Math.random()-0.5)*6;
      pPos[i+2] = (Math.random()-0.5)*6;
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    const pMat = new THREE.PointsMaterial({ size: 0.08, color: 0x00f3ff, transparent: true, opacity: 0.7 });
    const particles = new THREE.Points(pGeo, pMat);
    scene.add(particles);

    // --- LÓGICA DO GIRO E ANIMAÇÕES ---
    let isSpinning = false;
    let spinProgress = 0;
    let selectedFruit = FRUITS[0];
    let shakeIntensity = 0;

    function getRandomFruit() {
      const total = FRUITS.reduce((acc, f) => acc + f.prob, 0);
      let rand = Math.random() * total;
      for(let f of FRUITS) {
        if(rand < f.prob) return f;
        rand -= f.prob;
      }
      return FRUITS[0];
    }

    function spin() {
      initAudio();
      if(isSpinning) return;

      isSpinning = true;
      spinProgress = 0;
      document.getElementById('spin-btn').disabled = true;
      document.getElementById('result-box').classList.remove('show');

      selectedFruit = getRandomFruit();
    }

    function triggerRevealEffect() {
      playSound('reveal');
      shakeIntensity = 0.3; // Screen shake

      // Atualiza UI
      counts[selectedFruit.rarity]++;
      document.getElementById(`c-${selectedFruit.rarity.toLowerCase()}`).innerText = counts[selectedFruit.rarity];

      const nameEl = document.getElementById('fruit-name');
      const rarityEl = document.getElementById('fruit-rarity');
      nameEl.innerText = selectedFruit.name;
      nameEl.style.color = RARITY_COLORS[selectedFruit.rarity];
      rarityEl.innerText = selectedFruit.rarity;

      document.getElementById('result-box').classList.add('show');

      // Onda de choque
      shockwave.scale.set(1, 1, 1);
      shockMat.opacity = 1;
      shockMat.color.setHex(selectedFruit.color);
    }

    // Model inicial
    buildFruitModel('flame', 0xff4500);

    // --- LOOP PRINCIPAL (60 FPS) ---
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      particles.rotation.y = time * 0.1;

      // Animação da Onda de Choque
      if(shockMat.opacity > 0) {
        shockwave.scale.addScalar(0.25);
        shockMat.opacity -= 0.03;
      }

      // Camera Shake
      if(shakeIntensity > 0) {
        camera.position.x = (Math.random()-0.5) * shakeIntensity;
        camera.position.y = 2 + (Math.random()-0.5) * shakeIntensity;
        shakeIntensity -= delta * 0.8;
      } else {
        camera.position.x = 0; camera.position.y = 2;
      }

      if(isSpinning) {
        spinProgress += delta;

        // Troca o modelo 3D rapidamente durante o giro
        if(Math.floor(spinProgress * 20) % 2 === 0) {
          const tempFruit = FRUITS[Math.floor(Math.random()*FRUITS.length)];
          buildFruitModel(tempFruit.id, tempFruit.color);
          auraLight.color.setHex(tempFruit.color);
          pMat.color.setHex(tempFruit.color);
          playSound('tick');
        }

        fruitContainer.rotation.y += 0.4;
        fruitContainer.rotation.x += 0.2;

        // Fim do Giro (3 Segundos)
        if(spinProgress >= 3) {
          isSpinning = false;
          document.getElementById('spin-btn').disabled = false;

          buildFruitModel(selectedFruit.id, selectedFruit.color);
          auraLight.color.setHex(selectedFruit.color);
          pMat.color.setHex(selectedFruit.color);

          fruitContainer.rotation.set(0,0,0);
          triggerRevealEffect();
        }
      } else {
        // Animação Idle (Flutuando suavemente)
        fruitContainer.rotation.y += 0.01;
        fruitContainer.position.y = Math.sin(time * 2) * 0.15;
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
